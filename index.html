<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#15222b">
<title>小野人部落</title>
<style>
:root{--ink:#f1e9d4;--pane:rgba(16,24,30,.76);--line:rgba(255,255,255,.14);--acc:#e0a867;--acc2:#b9793a;--bad:#ef8a72}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#15222b;overflow:hidden;font-family:system-ui,-apple-system,"PingFang TC","Noto Sans TC",sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;width:100vw;height:100vh;touch-action:none}
button{font:inherit;color:var(--ink);cursor:pointer}
.pane{background:var(--pane);border:1px solid var(--line);border-radius:10px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#stat{position:fixed;left:8px;top:8px;padding:7px 10px 8px;font-size:12px;width:172px;pointer-events:none}
#stat .clk span{white-space:nowrap}
#stat .clk{font-size:13px;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;gap:6px}
.bar{display:flex;align-items:center;gap:5px;margin-top:3px}
.bar i{font-style:normal;width:16px;text-align:center}
.bar b{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden;display:block}
.bar b span{display:block;height:100%;width:50%;border-radius:4px;transition:width .3s}
#friends{position:fixed;right:8px;top:8px;padding:4px 8px;font-size:12px;width:168px}
.fr{display:flex;align-items:center;gap:6px;padding:4px 0;cursor:pointer}
.fr+.fr{border-top:1px solid var(--line)}
.fr .nm{font-weight:700;min-width:30px}
.fr .hv{color:#ff9aa8;min-width:36px;font-size:11.5px}
.fr .st{opacity:.72;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
#task{position:fixed;left:50%;top:8px;transform:translateX(-50%);width:max-content;max-width:min(460px,calc(100vw - 380px));padding:7px 12px;font-size:13px;line-height:1.45}
#task .tt{font-weight:700}
#task .th{font-size:11.5px;opacity:.75}
@media (max-width:820px){#task{left:8px;right:8px;top:86px;transform:none;width:auto;max-width:none}}
#tagbar{position:fixed;left:50%;top:24%;transform:translateX(-50%);padding:6px 16px;font-weight:700;font-size:15px;display:none;pointer-events:none;border-color:#e0a867}
#bag{position:fixed;left:8px;bottom:calc(10px + env(safe-area-inset-bottom));right:142px;display:flex;gap:6px;overflow-x:auto;padding:6px;scrollbar-width:none}
#bag::-webkit-scrollbar{display:none}
.slot{position:relative;flex:0 0 48px;height:48px;border-radius:10px;background:rgba(16,24,30,.78);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer}
.slot img{width:38px;height:38px;pointer-events:none}
.slot .c{position:absolute;right:4px;bottom:1px;font-size:11px;font-weight:700;text-shadow:0 1px 2px #000}
.slot.on{border-color:var(--acc);background:rgba(185,121,58,.55);box-shadow:0 0 0 1px var(--acc) inset}
.slot.empty{flex:0 0 auto;padding:0 12px;font-size:12px;opacity:.6;cursor:default}
#ctrl{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;align-items:flex-end}
#ctrl .col{display:flex;flex-direction:column;gap:7px;align-items:center}
.rb{background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:0;width:42px;height:42px;font-size:18px}
.rb.sm{font-size:12px;width:56px;height:30px;visibility:hidden}
#act{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#efbf88,#b9793a);border:2px solid #f3cd9d;font-size:17px;font-weight:800;color:#2b1a0d;box-shadow:0 4px 14px rgba(0,0,0,.45);padding:0}
#act:active,.rb:active,.slot:active{transform:scale(.95)}
#toast{position:fixed;left:50%;top:32%;transform:translateX(-50%);pointer-events:none;display:flex;flex-direction:column;gap:6px;align-items:center;z-index:6;width:92vw}
.tst{background:rgba(16,24,30,.9);border:1px solid var(--line);padding:7px 14px;border-radius:18px;font-size:13px;animation:tin .25s;text-align:center;max-width:92vw}
.tst.big{font-size:15px;font-weight:700;border-color:var(--acc)}
@keyframes tin{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:58vh;overflow-y:auto;padding:12px 14px calc(16px + env(safe-area-inset-bottom));border-radius:16px 16px 0 0;transform:translateY(105%);transition:transform .22s;z-index:5;max-width:640px;margin:0 auto}
#sheet.open{transform:none}
#sheet h3{margin:0 0 8px;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.x{background:none;border:none;font-size:20px;padding:0 4px}
.rc{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:6px}
.rc .ic{width:42px;height:42px;display:flex;align-items:center;justify-content:center;font-size:27px;flex:0 0 42px}
.rc .ic img{width:42px;height:42px}
.rc .inf{flex:1;font-size:12px;line-height:1.55}
.rc .inf b{font-size:14px}
.need{display:inline-flex;gap:2px;align-items:center;margin-right:7px;white-space:nowrap}
.need img{width:18px;height:18px}
.need.no{color:var(--bad)}
.dim{opacity:.68}
.go{background:var(--acc2);border:1px solid var(--acc);border-radius:8px;padding:8px 12px;font-weight:700;flex:0 0 auto}
.go:disabled{opacity:.32}
.grid{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.grid .slot{flex:0 0 48px}
.help{font-size:13px;line-height:1.75}
.help b{color:var(--acc)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="stat" class="pane">
  <div class="clk"><span id="clk">☀️ 第 1 天</span><span id="stars">⭐ 0</span></div>
  <div class="bar"><i>🍖</i><b><span id="bH" style="background:#e8a55a"></span></b></div>
  <div class="bar"><i>⚡</i><b><span id="bE" style="background:#7fc4e8"></span></b></div>
</div>
<div id="friends" class="pane"></div>
<div id="task" class="pane"><div class="tt" id="tt"></div><div class="th" id="th"></div></div>
<div id="tagbar" class="pane"></div>
<div id="bag"></div>
<div id="ctrl">
  <div class="col">
    <button id="bHelp" class="rb">？</button>
    <button id="bIn" class="rb">＋</button>
    <button id="bOut" class="rb">－</button>
  </div>
  <div class="col">
    <button id="bDrop" class="rb sm">放下</button>
    <button id="bCraft" class="rb">🔨</button>
    <button id="act">休息</button>
  </div>
</div>
<div id="toast"></div>
<div id="sheet" class="pane"><h3><span id="shT"></span><button class="x" id="shX">✕</button></h3><div id="shB"></div></div>
<script>
'use strict';
/* =========================================================
   小野人部落
   座標：2:1 等角，1 tile = 32 model 單位，z 向上
   iso(x,y,z) → 螢幕 px（未套相機）：+x 往右下、+y 往左下
   ========================================================= */
const U = 32, MAP_W = 22, MAP_H = 20, NT = MAP_W * MAP_H;
const ELEV = [0, 8, 16, 24, 32];
const BASE_Z = -14, WATER_Z = -2, WATER_FLOOR = -8;
const TAU = Math.PI * 2, RS2 = Math.SQRT1_2;
const DAY_MS = 360000;                       // 一天 6 分鐘（6:00 為一天開始）
const SAVE_KEY = 'yeren_tribe_v1';
const EMO_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const iso = (x, y, z) => [x - y, (x + y) * 0.5 - z];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
function angDiff(a, b) { let d = (a - b) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const rnd = (a, b) => a + Math.random() * (b - a);
const pickR = a => a[(Math.random() * a.length) | 0];
const gi = (x, y) => y * MAP_W + x;
const manh = (ax, ay, bx, by) => Math.abs(ax - bx) + Math.abs(ay - by);
const DIRS = [
  { dx: 1, dy: 0, a: 0 },
  { dx: 0, dy: 1, a: Math.PI / 2 },
  { dx: -1, dy: 0, a: Math.PI },
  { dx: 0, dy: -1, a: -Math.PI / 2 },
];
const dirIdx = (ax, ay, bx, by) => DIRS.findIndex(d => ax + d.dx === bx && ay + d.dy === by);
let gameT = 0, clock = 0, SEED = 930;

/* ---------------- 地形 ---------------- */
let map = [], PLAT = [], START = [10, 9];
const RING = new Uint8Array(NT);
const inB = (x, y) => x >= 0 && y >= 0 && x < MAP_W && y < MAP_H;
const tile = (x, y) => map[y][x];
const lvl = (x, y) => map[y][x].water ? 0 : map[y][x].lv;
const groundZ = (x, y) => map[y][x].water ? WATER_FLOOR : ELEV[map[y][x].lv];
const topZ = (x, y) => map[y][x].water ? WATER_Z : ELEV[map[y][x].lv];
const terrOK = (ax, ay, bx, by) => inB(bx, by) && Math.abs(lvl(bx, by) - lvl(ax, ay)) <= 1;
function canMove(ax, ay, bx, by) { return terrOK(ax, ay, bx, by) && !isBlocked(bx, by); }
function reachFrom(sx, sy, useObj) {
  const seen = new Uint8Array(NT), q = [gi(sx, sy)]; seen[q[0]] = 1;
  for (let h = 0; h < q.length; h++) {
    const c = q[h], cx = c % MAP_W, cy = (c / MAP_W) | 0;
    for (const d of DIRS) {
      const nx = cx + d.dx, ny = cy + d.dy; if (!inB(nx, ny)) continue;
      const id = gi(nx, ny); if (seen[id]) continue;
      if (useObj ? !canMove(cx, cy, nx, ny) : !terrOK(cx, cy, nx, ny)) continue;
      seen[id] = 1; q.push(id);
    }
  }
  return { seen, n: q.length };
}
function genTerrain(seed) {
  const R = mulberry32(seed);
  function valueNoise(cell) {
    const gw = Math.ceil(MAP_W / cell) + 2, gh = Math.ceil(MAP_H / cell) + 2, g = [];
    for (let i = 0; i < gw * gh; i++) g.push(R());
    const sm = t => t * t * (3 - 2 * t);
    return (x, y) => {
      const fx = x / cell, fy = y / cell, ix = Math.floor(fx), iy = Math.floor(fy), tx = sm(fx - ix), ty = sm(fy - iy);
      const v = (i, j) => g[(iy + j) * gw + (ix + i)];
      return lerp(lerp(v(0, 0), v(1, 0), tx), lerp(v(0, 1), v(1, 1), tx), ty);
    };
  }
  const nA = valueNoise(6), nB = valueNoise(3);
  const cx = (MAP_W - 1) / 2, cy = (MAP_H - 1) / 2, vals = [];
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const dx = (x - cx) / (MAP_W * 0.5), dy = (y - cy) / (MAP_H * 0.5);
    vals.push(nA(x, y) * 0.7 + nB(x, y) * 0.3 - Math.pow(Math.hypot(dx, dy), 2.4) * 0.85);
  }
  const sorted = [...vals].sort((a, b) => a - b), qt = p => sorted[Math.floor(p * (sorted.length - 1))];
  const TH = [qt(.32), qt(.47), qt(.63), qt(.79), qt(.92)];
  map = [];
  for (let y = 0; y < MAP_H; y++) {
    const row = [];
    for (let x = 0; x < MAP_W; x++) {
      const v = vals[gi(x, y)]; let lv = 0, water = false;
      if (v < TH[0] || x === 0 || y === 0 || x === MAP_W - 1 || y === MAP_H - 1) water = true;
      else if (v < TH[1]) lv = 0; else if (v < TH[2]) lv = 1; else if (v < TH[3]) lv = 2; else if (v < TH[4]) lv = 3; else lv = 4;
      row.push({ lv, water, j: (R() - 0.5) * 0.08, plat: false });
    }
    map.push(row);
  }
  let best = 1e9;
  for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
    const t = map[y][x]; if (t.water) continue;
    const d = (x - cx) ** 2 + (y - cy) ** 2 + (t.lv === 1 ? 0 : t.lv === 0 || t.lv === 2 ? 6 : 30);
    if (d < best) { best = d; START = [x, y]; }
  }
  // 高台（2x2、lv4，外圈一律 lv2 → 必須堆石階才上得去）
  let bp = null, bs = -1e9;
  for (let py = 3; py <= MAP_H - 5; py++) for (let px = 3; px <= MAP_W - 5; px++) {
    let ok = true, s = 0;
    for (let j = 0; j < 2; j++) for (let i = 0; i < 2; i++) { const t = map[py + j][px + i]; if (t.water) ok = false; s += t.lv; }
    if (!ok) continue;
    if (START[0] >= px - 2 && START[0] <= px + 3 && START[1] >= py - 2 && START[1] <= py + 3) continue;
    const dd = manh(px, py, START[0], START[1]);
    const sc = s + Math.min(dd, 12) * 0.5 + R() * 0.8;
    if (dd >= 6 && sc > bs) { bs = sc; bp = [px, py]; }
  }
  if (!bp) bp = START[0] > MAP_W / 2 ? [3, 3] : [MAP_W - 5, MAP_H - 5];
  const [px, py] = bp; PLAT = []; RING.fill(0);
  for (let y = py - 2; y <= py + 3; y++) for (let x = px - 2; x <= px + 3; x++) {
    if (!inB(x, y)) continue;
    const t = map[y][x], inner = x >= px && x <= px + 1 && y >= py && y <= py + 1, ring = x >= px - 1 && x <= px + 2 && y >= py - 1 && y <= py + 2;
    if (inner) { t.water = false; t.lv = 4; t.plat = true; PLAT.push([x, y]); }
    else if (ring) { t.water = false; t.lv = 2; RING[gi(x, y)] = 1; }
    else if (!t.water) t.lv = Math.min(t.lv, 3);
  }
  // 連通修正：除了高台，陸地都要走得到
  for (let it = 0; it < 80; it++) {
    const { seen } = reachFrom(START[0], START[1], false); let ch = false;
    for (let y = 0; y < MAP_H; y++) for (let x = 0; x < MAP_W; x++) {
      const t = map[y][x]; if (seen[gi(x, y)] || t.water || t.plat) continue;
      for (const d of DIRS) {
        const nx = x + d.dx, ny = y + d.dy; if (!inB(nx, ny) || !seen[gi(nx, ny)]) continue;
        let v = clamp(t.lv, lvl(nx, ny) - 1, lvl(nx, ny) + 1); if (RING[gi(x, y)]) v = Math.min(v, 2);
        v = clamp(v, 0, 4); if (v !== t.lv) { t.lv = v; ch = true; }
        break;
      }
    }
    if (!ch) break;
  }
  return R;
}

const PAL = {
  water: { top: [63, 143, 176], L: [38, 94, 118], R: [46, 110, 136] },
  0: { top: [232, 212, 158], L: [186, 161, 108], R: [205, 181, 126] },
  1: { top: [214, 201, 134], L: [164, 148, 94], R: [184, 167, 110] },
  2: { top: [150, 181, 95], L: [102, 126, 68], R: [120, 145, 80] },
  3: { top: [118, 156, 76], L: [82, 108, 54], R: [96, 126, 64] },
  4: { top: [156, 150, 140], L: [106, 102, 96], R: [126, 121, 114] },
};
const rgb = (c, j) => `rgb(${clamp(c[0] * (1 + j), 0, 255) | 0},${clamp(c[1] * (1 + j), 0, 255) | 0},${clamp(c[2] * (1 + j), 0, 255) | 0})`;
function poly(ctx, pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]); ctx.closePath(); ctx.fill(); }
function drawTile(ctx, x, y, time) {
  const t = map[y][x], z = t.water ? WATER_Z : ELEV[t.lv], pal = t.water ? PAL.water : PAL[t.lv];
  const x0 = x * U, y0 = y * U, x1 = x0 + U, y1 = y0 + U;
  const N = iso(x0, y0, z), E = iso(x1, y0, z), S = iso(x1, y1, z), W_ = iso(x0, y1, z);
  const Sb = iso(x1, y1, BASE_Z), Eb = iso(x1, y0, BASE_Z), Wb = iso(x0, y1, BASE_Z);
  let j = t.j; if (t.water) j += 0.05 * Math.sin(time * 0.002 + x * 0.9 + y * 0.6);
  poly(ctx, [E, S, Sb, Eb], rgb(pal.R, j));
  poly(ctx, [W_, S, Sb, Wb], rgb(pal.L, j));
  poly(ctx, [N, E, S, W_], rgb(pal.top, j));
  ctx.strokeStyle = 'rgba(0,0,0,.07)'; ctx.lineWidth = 0.8; ctx.stroke();
}
function tileDiamond(ctx, x, y, col, k = 1, lw = 1.2) {
  const z = topZ(x, y), c = iso((x + .5) * U, (y + .5) * U, z);
  ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath();
  ctx.moveTo(c[0], c[1] - 16 * k); ctx.lineTo(c[0] + 32 * k, c[1]); ctx.lineTo(c[0], c[1] + 16 * k); ctx.lineTo(c[0] - 32 * k, c[1]); ctx.closePath(); ctx.stroke();
}

/* ---------------- 小工具繪圖 ---------------- */
function cap(ctx, a, b, w, col) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.lineTo(b[0], b[1]); ctx.stroke(); }
function disc(ctx, p, r, col) { ctx.fillStyle = col; ctx.beginPath(); ctx.arc(p[0], p[1], r, 0, TAU); ctx.fill(); }
function blob(c, x, y, rx, ry, fill, ol, lw = 1) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, TAU); c.fillStyle = fill; c.fill(); if (ol) { c.lineWidth = lw; c.strokeStyle = ol; c.stroke(); } }
const dep = p => p[0] + p[1] + p[2] * 0.05;

/* ---------------- 物品 ---------------- */
const IT = {
  stick: { n: '樹枝' }, stone: { n: '石塊' }, grass: { n: '乾草' },
  berry: { n: '莓果', food: 16 }, fruit: { n: '果子', food: 28 },
  mushroom: { n: '香菇', food: 12, cook: 'cookedMush' }, cookedMush: { n: '烤香菇', food: 26 },
  fish: { n: '生魚', cook: 'cookedFish' }, cookedFish: { n: '烤魚', food: 50 },
  seed: { n: '種子' }, shell: { n: '貝殼' }, flower: { n: '小花' }, wreath: { n: '花圈' },
  axe: { n: '石斧', tool: 1 }, spear: { n: '魚叉', tool: 1 }, egg: { n: '神秘蛋' },
};
const RECIPES = [
  { id: 'axe', n: '石斧', need: { stick: 1, stone: 1 }, out: 'axe', desc: '搖樹一次拿兩根樹枝' },
  { id: 'spear', n: '魚叉', need: { stick: 2, stone: 1 }, out: 'spear', desc: '抓魚成功率大增' },
  { id: 'wreath', n: '花圈', need: { flower: 3 }, out: 'wreath', desc: '夥伴最愛的禮物' },
  { id: 'fire', n: '營火', need: { stick: 3, stone: 2 }, build: 'fire', emo: '🔥', desc: '烤食物、夜裡照明，要記得加柴' },
  { id: 'basket', n: '儲物籃', need: { grass: 3, stick: 1 }, build: 'basket', emo: '🧺', desc: '部落共用倉庫，阿蓬會把收成放進來' },
  { id: 'hut', n: '草屋', need: { stick: 4, grass: 4 }, build: 'hut', emo: '🛖', desc: '在旁邊睡覺，精力恢復最快' },
  { id: 'step', n: '石階', need: { stone: 3 }, terrain: true, emo: '🪨', desc: '把旁邊一格墊高一層（水面會填成沙地）' },
];
function drawItemIcon(c, k, x, y, s = 1) {
  c.save(); c.translate(x, y); c.scale(s, s); c.lineCap = 'round'; c.lineJoin = 'round';
  const OL = '#3e2616';
  switch (k) {
    case 'stick':
      cap(c, [-5, 3.5], [5, -3.5], 3, OL); cap(c, [-5, 3.5], [5, -3.5], 1.8, '#a0703f');
      cap(c, [1, -0.7], [2.2, -4.2], 2.2, OL); cap(c, [1, -0.7], [2.2, -4.2], 1.1, '#a0703f'); break;
    case 'stone': blob(c, 0, 0.5, 4.8, 3.6, '#99958d', OL, 0.9); blob(c, -1.3, -0.6, 2, 1.1, '#c3bfb6'); break;
    case 'grass':
      for (const a of [-0.5, -0.25, 0, 0.25, 0.5]) { const ex = Math.sin(a) * 6.5, ey = -Math.cos(a) * 6.5 + 2.5; cap(c, [0, 4], [ex, ey], 2.2, '#5d6a2a'); cap(c, [0, 4], [ex, ey], 1.2, '#d3c86e'); }
      cap(c, [-2, 2], [2, 2], 1.8, '#8a6030'); break;

  doAnim(k, dur, cb, item) { this.anim = { k, t: 0, dur: dur || 0, cb: cb || null, item: item || null }; this.animK = k; this.animT = 0; }
  emote(e, dur = 1600) { this.emo = { e, t: 0, dur }; }
  faceAng(a) { this.faceT = this.face + angDiff(a, this.face); }
  faceXY(x, y) { const dx = x - this.x, dy = y - this.y; if (Math.abs(dx) + Math.abs(dy) > 0.5) this.faceAng(Math.atan2(dy, dx)); }
  faceTile(x, y) { this.faceXY((x + .5) * U, (y + .5) * U); }
  frontTile() {
    let bi = 0, bd = 9;
    DIRS.forEach((d, i) => { const a = Math.abs(angDiff(d.a, this.faceT)); if (a < bd) { bd = a; bi = i; } });
    return [this.tx + DIRS[bi].dx, this.ty + DIRS[bi].dy];
  }
  get sleeping() { return !!(this.anim && this.anim.k === 'sleep'); }

  tryStep(di, run) {
    if (this.anim && (this.anim.k === 'sit' || this.anim.k === 'sleep')) this.anim = null;
    const d = DIRS[di];
    this.faceT = this.face + angDiff(d.a, this.face);
    const nx = this.tx + d.dx, ny = this.ty + d.dy;
    if (!canMove(this.tx, this.ty, nx, ny)) { if (this.bump < 0.12) this.bump = 1; return false; }
    const dl = lvl(nx, ny) - lvl(this.tx, this.ty);
    const wet = tile(nx, ny).water || tile(this.tx, this.ty).water;
    this.fx = this.tx; this.fy = this.ty; this.tx = nx; this.ty = ny;
    this.moveDur = (run ? 260 : 440) * (wet ? 1.45 : 1) * (dl > 0 ? 1.15 : 1) * this.speedMul;
    this.hopH = dl !== 0 ? 6 + Math.abs(dl) * 3 : 0;
    this.moveT = this.leftover; this.leftover = 0;
    this.moving = true; this.running = run;
    return true;
  }

  update(dt) {
    const s = dt / 1000; this.t += dt;
    if (this.anim) {
      this.anim.t += dt; this.animT = this.anim.t; this.animK = this.anim.k;
      if (this.anim.dur > 0 && this.anim.t >= this.anim.dur) { const cb = this.anim.cb; this.anim = null; if (cb) cb(); }
    }
    const ak = this.anim ? this.anim.k : null;
    this.animB += ((this.anim ? 1 : 0) - this.animB) * Math.min(1, s * 9);
    if (!this.anim && this.animB < 0.02) this.animK = null;
    this.crouchB += ((ak === 'sleep' || ak === 'sit' ? 1 : 0) - this.crouchB) * Math.min(1, s * 5);
    this.holdB += ((this.hold && !this.anim ? 1 : 0) - this.holdB) * Math.min(1, s * 8);
    this.sadB += ((this.sad && !this.anim ? 1 : 0) - this.sadB) * Math.min(1, s * 3);
    if (this.emo) { this.emo.t += dt; if (this.emo.t > this.emo.dur) this.emo = null; }
    if (ak === 'sleep') { this.zT -= dt; if (this.zT <= 0) { this.zT = 2900; if (!this.emo) this.emote('💤', 1900); } }

    let dist = 0;
    if (this.moving) {
      this.moveT += dt;
      const p = Math.min(1, this.moveT / this.moveDur);
      const nx = lerp((this.fx + .5) * U, (this.tx + .5) * U, p), ny = lerp((this.fy + .5) * U, (this.ty + .5) * U, p);
      dist = Math.hypot(nx - this.x, ny - this.y); this.x = nx; this.y = ny;
      const z0 = groundZ(this.fx, this.fy), z1 = groundZ(this.tx, this.ty);
      if (this.hopH > 0) { const e = p * p * (3 - 2 * p); this.gz = lerp(z0, z1, e); this.hop = this.hopH * Math.sin(p * Math.PI); }
      else { this.gz = lerp(z0, z1, p); this.hop = 0; }
      if (p >= 1) {
        this.moving = false; this.leftover = this.moveT - this.moveDur; this.hop = 0; this.gz = z1;
        if (this.hopH > 0) { this.squash = 1; this.landFx(); }
      }
    } else { this.leftover = 0; this.gz = groundZ(this.tx, this.ty); }

    this.blend = this.moving ? Math.min(1, this.blend + s * 7) : Math.max(0, this.blend - s * 4);
    this.runB += ((this.moving && this.running ? 1 : 0) - this.runB) * Math.min(1, s * 6);
    this.phase += dist * (STEP_PER_TILE / U);
    if (!this.moving) { const tp = Math.round(this.phase / Math.PI) * Math.PI; this.phase += (tp - this.phase) * Math.min(1, s * 6); }
    this.face += (this.faceT - this.face) * Math.min(1, s * 14);

    if (ak === 'inspect') this.headYawT = 0.7 * Math.sin(this.animT * 0.0035);
    else if (ak === 'sleep') this.headYawT = 0;
    else if (!this.moving && this.blend < 0.05) {
      this.lookTimer -= dt;
      if (this.lookTimer <= 0) { this.headYawT = Math.random() < 0.35 ? 0 : Math.random() * 1.3 - 0.65; this.lookTimer = 1200 + Math.random() * 2800; }
    } else { this.headYawT = 0; this.lookTimer = 1500; }
    this.headYaw += (this.headYawT - this.headYaw) * Math.min(1, s * (this.moving ? 10 : 4));

    if (ak !== 'sleep') { this.blinkTimer -= dt; if (this.blinkTimer <= 0) { this.blink = 1; this.blinkTimer = 1800 + Math.random() * 3500; } }
    this.blink = Math.max(0, this.blink - s * 7);
    this.squash = Math.max(0, this.squash - s * 4.5);
    this.bump = Math.max(0, this.bump - s * 2.6);

    for (let i = 0; i < 2; i++) {
      const c = Math.cos(this.phase + i * Math.PI);
      if (this.prevCos[i] > 0 && c <= 0 && this.blend > 0.35 && this.hop < 0.5) this.footFx(i);
      this.prevCos[i] = c;
    }
    if (!this.moving && this.underTile().water) {
      this.rippleT -= dt;
      if (this.rippleT <= 0) { this.rippleT = 1100; fx.push({ k: 'ring', x: this.x, y: this.y, z: WATER_Z, t: 0, life: 1400, r0: 6, grow: 7 }); }
    }

    this.computePose();
    this.updateLayers(false);
    const n = Math.max(1, Math.ceil(dt / 16)), h = dt / n;
    for (let i = 0; i < n; i++) this.simHair(h);
  }

  /* ---------- 骨架 ---------- */
  computePose() {
    const b = this.blend, rb = this.runB, ph = this.phase, t = this.t;
    const ak = this.animK, ab = this.animB, at = this.animT, cr = this.crouchB, hb = this.holdB, sd = this.sadB;
    const f0 = Math.cos(this.face), f1 = Math.sin(this.face), s0 = -f1, s1 = f0;
    const cheer = ak === 'cheer' ? ab * Math.abs(Math.sin(at * 0.011)) * 3.5 : 0;
    const X = this.x, Y = this.y, Z = this.z + cheer;
    const L = (u, v, z) => [X + f0 * u + s0 * v, Y + f1 * u + s1 * v, Z + z];
    const air = (this.moving && this.hopH > 0) ? Math.sin(this.progress * Math.PI) : 0;
    const slp = ak === 'sleep' ? ab : 0, work = ak === 'work' ? ab : 0, insp = ak === 'inspect' ? ab : 0;
    const breath = Math.sin(t * (slp > 0.5 ? 0.0018 : 0.0026)) * (1 + slp);
    const crouch = cr * 4.6;
    const bob = b * (1.0 + 0.7 * rb) * Math.cos(2 * ph) * (1 - air) - this.squash * 2.2 + (1 - b) * breath * 0.25;
    const lean = b * (1.0 + 2.0 * rb) + Math.sin(this.bump * Math.PI) * 2.6 + work * (1.2 + Math.sin(at * 0.016) * 0.9) + insp * 2.2 + cr * 1.4 + sd * 0.7;
    const sway = b * Math.sin(ph) * (0.6 - 0.25 * rb);
    const P = { f: [f0, f1], s: [s0, s1], air };
    P.hip = L(lean * 0.25, sway * 0.6, HIP_Z + bob - crouch);
    P.sh = L(lean, sway, SH_Z + bob - crouch + (1 - b) * breath * 0.35);
    const nod = -b * (0.4 + 0.5 * rb) * Math.cos(2 * ph - 0.7);
    P.head = L(lean * 1.25 + slp * 1.2, sway * 1.1, HEAD_Z + bob * 1.15 - crouch + nod * 0.6 + (1 - b) * breath * 0.3 - slp * 2 - sd * 1.2);
    P.roll = b * Math.sin(ph) * 0.09 + this.headYaw * 0.18 + insp * 0.22 * Math.sin(at * 0.004) + slp * 0.2;

    P.legs = [];
    const A = b * (3.6 + 0.9 * rb) * (1 - air * 0.7), LIFT = b * (2.4 + 2.2 * rb) * (1 - air);
    for (let i = 0; i < 2; i++) {
      const side = i ? -1 : 1, a = ph + i * Math.PI;
      const hu = lean * 0.25, hv = side * 2.7 + sway * 0.6, hz = HIP_Z + bob - crouch;
      let fu = A * Math.sin(a) + lean * 0.15, fz = Math.max(0, Math.cos(a)) * LIFT + air * 3.5 + ANKLE;
      const fv = side * (2.9 + cr * 0.9);
      let du = fu - hu, dz = fz - hz, d = Math.hypot(du, dz);
      const maxd = L1 + L2 - 0.05;
      if (d > maxd) { fu = hu + du / d * maxd; fz = hz + dz / d * maxd; du = fu - hu; dz = fz - hz; d = maxd; }
      const a1 = (L1 * L1 - L2 * L2 + d * d) / (2 * d), hh = Math.sqrt(Math.max(0, L1 * L1 - a1 * a1));
      const bu = hu + du * a1 / d, bz = hz + dz * a1 / d;
      const ku = bu + (-dz / d) * hh, kz = bz + (du / d) * hh;
      P.legs.push({
        side, hip: L(hu, hv, hz), knee: L(ku, lerp(hv, fv, 0.5) + side * 0.2, kz),
        foot: L(fu, fv, fz), toe: L(fu + 2.2, fv * 1.05, fz - 0.4),
      });
    }

    P.arms = [];
    const shake = this.bump > 0 ? Math.sin(this.bump * 26) * 0.3 * this.bump : 0;
    for (let i = 0; i < 2; i++) {
      const side = i ? -1 : 1, a = ph + i * Math.PI + Math.PI;
      let al = Math.sin(a) * b * (0.6 + 0.5 * rb) + (1 - b) * (0.08 + breath * 0.03) + air * 1.0 - sd * 0.1;
      let out = 0.24 + air * 0.6 + (1 - b) * 0.06;
      let be = al + 0.35 + b * (0.25 + 0.8 * rb) + air * 0.3;
      let hv = side * 0.4, T = null;
      switch (ak) {
        case 'work': { const w = Math.sin(at * 0.016); T = [1.5 + 1.1 * w, 0.14, 1.9 + 1.2 * w, -side * 1.8]; break; }
        case 'eat': T = i === 0 ? [1.2 + 0.1 * Math.sin(at * 0.022), 0.34, 2.9, -side * 1.4] : null; break;
        case 'wave': T = i === 0 ? [2.75, 0.55 + 0.3 * Math.sin(at * 0.017), 3.1 + 0.45 * Math.sin(at * 0.017), side * 0.4] : null; break;
        case 'cheer': T = [2.8 + 0.15 * Math.sin(at * 0.022 + i * 2), 0.55, 3.1, side * 0.5]; break;
        case 'sleep': case 'sit': T = [0.5, 0.34, 1.35, -side * 0.3]; break;
        case 'inspect': T = i === 0 ? [1.05, 0.3, 2.75, -side * 1.2] : [-0.3, 0.2, -0.05, side * 0.2]; break;
        case 'give': T = [1.3, 0.12, 1.6, -side * 1.6]; break;
      }
      if (T) { al = lerp(al, T[0], ab); out = lerp(out, T[1], ab); be = lerp(be, T[2], ab); hv = lerp(hv, T[3], ab); }
      if (hb > 0.01) { al = lerp(al, 0.8, hb); out = lerp(out, 0.1, hb); be = lerp(be, 1.65, hb); hv = lerp(hv, -side * 2, hb); }
      const su = lean * 0.95, sv = side * 5.1 + sway, sz = SH_Z + bob - crouch - 1.4;
      const eu = su + Math.sin(al) * LU * Math.cos(out), ev = sv + side * Math.sin(out) * LU, ez = sz - Math.cos(al) * LU * Math.cos(out);
      P.arms.push({ side, sh: L(su, sv, sz), el: L(eu, ev, ez), hand: L(eu + Math.sin(be) * LF, ev + hv, ez - Math.cos(be) * LF) });
    }
    const h0 = P.arms[0].hand, h1 = P.arms[1].hand;
    P.holdPt = [(h0[0] + h1[0]) / 2 + f0 * 1.2, (h0[1] + h1[1]) / 2 + f1 * 1.2, (h0[2] + h1[2]) / 2 + 1.5];

    const hyaw = this.face + this.headYaw + shake;
    P.hf = [Math.cos(hyaw), Math.sin(hyaw)]; P.hs = [-P.hf[1], P.hf[0]];
    this.pose = P;
  }

  /* ---------- 頭髮（verlet 繩） ---------- */
  headDir(a, e) {
    const P = this.pose, ca = Math.cos(a), sa = Math.sin(a), ce = Math.cos(e);
    return [(P.hf[0] * ca + P.hs[0] * sa) * ce, (P.hf[1] * ca + P.hs[1] * sa) * ce, Math.sin(e)];
  }
  headPt(a, e, k) {
    const h = this.pose.head, n = this.headDir(a, e);
    return [h[0] + n[0] * RH * k, h[1] + n[1] * RH * k, h[2] + n[2] * RV * k];
  }
  buildHair() {
    const H = [];
    const add = (a, e, n, seg, w, stiff, out, down, k, tp, top) => H.push({ a, e, n, seg, w, stiff, out, down, k, tp, top: !!top, front: false, overBody: false, p: [], q: [] });
    if (this.hairStyle === 'shaggy') {
      for (let i = 0; i < 9; i++) add(Math.PI + (i - 4) * 0.36, 0.12, 3, 2.5, 6.2, 0.22, 0.9, 0.9, 0.82, 0.5);
      for (const sg of [-1, 1]) add(sg * 1.35, 0.3, 2, 2.4, 5.2, 0.25, 1, 0.9, 0.84, 0.45);
      for (let i = 0; i < 4; i++) add((i - 1.5) * 0.45, 0.8, 2, 2.2, 5, 0.28, 0.95, 0.35, 0.84, 0.35);
      for (let i = 0; i < 3; i++) add(Math.PI + (i - 1) * 0.9, 1.25, 2, 2.6, 5.2, 0.45, 0.4, -0.6, 0.8, 0.2);
    } else if (this.hairStyle === 'topknot') {
      for (let i = 0; i < 7; i++) add(Math.PI + (i - 3) * 0.45, 0.1, 1, 2.3, 6, 0.3, 1, 0.6, 0.82, 0.5);
      for (let i = 0; i < 5; i++) add(Math.PI * 0.92 + (i - 2) * 0.3, 1.38, 3, 2.9, 5.6, 0.6, 0.18, -1.0, 0.76, 0.15, true);
      for (let i = 0; i < 3; i++) add((i - 1) * 0.5, 0.86, 1, 2.2, 4.8, 0.3, 1, -0.2, 0.84, 0.3);
    } else {
      for (let i = 0; i < 7; i++) add(Math.PI + (i - 3) * 0.4, 0.08, 2, 2.2, 6, 0.25, 1, 0.8, 0.8, 0.45);
      for (let i = 0; i < 7; i++) add(Math.PI + (i - 3) * 0.55, 0.95 + 0.15 * (i % 2), 2, 3.4, 5.8, 0.5, 0.55, -1.0, 0.8, 0.1);
      for (let i = 0; i < 3; i++) add(Math.PI + (i - 1) * 1.2, 1.4, 2, 3.2, 5.4, 0.5, 0.35, -1.0, 0.8, 0.1);
      for (let i = 0; i < 3; i++) add((i - 1) * 0.45, 0.88, 2, 2.1, 4.6, 0.3, 1, -0.3, 0.82, 0.2);
    }
    this.hair = H;
  }
  restDir(S) {
    const n = this.headDir(S.a, S.e);
    const r = [n[0] * S.out, n[1] * S.out, n[2] * S.out - S.down];
    const m = Math.hypot(r[0], r[1], r[2]) || 1;
    return [r[0] / m, r[1] / m, r[2] / m];
  }
  updateLayers(init) {
    const P = this.pose, fc = (P.f[0] + P.f[1]) * RS2;
    if (init) this.awayBody = fc < 0;
    else if (this.awayBody && fc > LAYER_HYST) this.awayBody = false;
    else if (!this.awayBody && fc < -LAYER_HYST) this.awayBody = true;
    for (const S of this.hair) {
      if (S.top) { S.front = true; S.overBody = true; continue; }
      const n = this.headDir(S.a, S.e), c = (n[0] + n[1]) * RS2;
      if (init) S.front = c >= 0; else if (S.front && c < -LAYER_HYST) S.front = false; else if (!S.front && c > LAYER_HYST) S.front = true;
      S.overBody = Math.cos(S.a) < 0 ? this.awayBody : !this.awayBody;
    }
  }
  resetHair() {
    for (const S of this.hair) {
      const A = this.headPt(S.a, S.e, S.k), rd = this.restDir(S);
      S.p = []; S.q = [];
      for (let i = 0; i <= S.n; i++) { const p = [A[0] + rd[0] * S.seg * i, A[1] + rd[1] * S.seg * i, A[2] + rd[2] * S.seg * i]; S.p.push(p); S.q.push(p.slice()); }
    }
  }
  simHair(h) {
    const P = this.pose, r = h / 16, r2 = r * r, vs = h / this.hPrev; this.hPrev = h;
    const damp = Math.pow(0.85, r), g = 0.24 * r2;
    const wx = Math.sin(this.t * 0.0009) * 0.03 * r2, wy = Math.cos(this.t * 0.0013) * 0.03 * r2;
    const hc = P.head, sc = P.sh, hipz = P.hip[2], floor = this.gz + 0.5;
    for (const S of this.hair) {
      const A = this.headPt(S.a, S.e, S.k), rd = this.restDir(S);
      const k = 1 - Math.pow(1 - S.stiff, r);
      S.p[0] = A;
      for (let i = 1; i <= S.n; i++) {
        const p = S.p[i], q = S.q[i];
        const vx = (p[0] - q[0]) * vs * damp, vy = (p[1] - q[1]) * vs * damp, vz = (p[2] - q[2]) * vs * damp;
        q[0] = p[0]; q[1] = p[1]; q[2] = p[2];
        p[0] += vx + wx; p[1] += vy + wy; p[2] += vz - (S.top ? g * 0.3 : g);
        const kk = k * (1 - 0.5 * i / S.n);
        p[0] += (A[0] + rd[0] * S.seg * i - p[0]) * kk;
        p[1] += (A[1] + rd[1] * S.seg * i - p[1]) * kk;
        p[2] += (A[2] + rd[2] * S.seg * i - p[2]) * kk;
      }
      for (let it = 0; it < 3; it++) {
        for (let i = 1; i <= S.n; i++) {
          const a = S.p[i - 1], p = S.p[i];
          const dx = p[0] - a[0], dy = p[1] - a[1], dz = p[2] - a[2];
          const d = Math.hypot(dx, dy, dz) || 1e-6, df = (d - S.seg) / d;
          if (i === 1) { p[0] -= dx * df; p[1] -= dy * df; p[2] -= dz * df; }
          else { const h2 = df * 0.5; a[0] += dx * h2; a[1] += dy * h2; a[2] += dz * h2; p[0] -= dx * h2; p[1] -= dy * h2; p[2] -= dz * h2; }
        }
        for (let i = 1; i <= S.n; i++) {
          const p = S.p[i];
          let dx = p[0] - hc[0], dy = p[1] - hc[1], dz = p[2] - hc[2];
          const kq = Math.sqrt((dx * dx + dy * dy) / (RH * RH) + dz * dz / (RV * RV));
          if (kq < 1.04 && kq > 1e-4) { const m = 1.04 / kq; p[0] = hc[0] + dx * m; p[1] = hc[1] + dy * m; p[2] = hc[2] + dz * m; }
          if (p[2] < sc[2] + 1.5 && p[2] > hipz - 2) {
            dx = p[0] - sc[0]; dy = p[1] - sc[1]; const dd = Math.hypot(dx, dy), rr = 5.6;
            if (dd < rr && dd > 1e-4) { p[0] = sc[0] + dx / dd * rr; p[1] = sc[1] + dy / dd * rr; }
          }
          if (p[2] < floor) p[2] = floor;
        }
      }
    }
  }

  /* ---------- 特效 ---------- */
  footFx(i) {
    const leg = this.pose.legs[i], t = this.underTile();
    if (t.water && this.z < WATER_Z) {
      fx.push({ k: 'ring', x: leg.foot[0], y: leg.foot[1], z: WATER_Z, t: 0, life: 700, r0: 2, grow: 7 });
      for (let n = 0; n < 3; n++) fx.push({ k: 'drop', x: leg.foot[0], y: leg.foot[1], z: WATER_Z + 0.5, vx: (Math.random() - .5) * 0.03, vy: (Math.random() - .5) * 0.03, vz: 0.04 + Math.random() * 0.03, t: 0, life: 600 });
    } else {
      const n = this.runB > 0.5 ? 3 : 1;
      for (let k = 0; k < n; k++) fx.push({ k: 'dust', x: leg.foot[0], y: leg.foot[1], z: this.gz + 1, vx: (Math.random() - .5) * 0.02, vy: (Math.random() - .5) * 0.02, vz: 0.008 + Math.random() * 0.01, t: 0, life: 380 + Math.random() * 220, r: 1.1 + Math.random() * 1.1, c: dustColor(t) });
    }
  }
  landFx() {
    const t = tile(this.tx, this.ty);
    if (t.water) { fx.push({ k: 'ring', x: this.x, y: this.y, z: WATER_Z, t: 0, life: 900, r0: 4, grow: 12 }); return; }
    for (let k = 0; k < 7; k++) { const a = k / 7 * TAU; fx.push({ k: 'dust', x: this.x, y: this.y, z: this.gz + 1, vx: Math.cos(a) * 0.03, vy: Math.sin(a) * 0.03, vz: 0.006, t: 0, life: 450, r: 1.5, c: dustColor(t) }); }
  }

  /* ---------- 繪製 ---------- */

  const [wx, wy] = toWorld(px, py);

}
const HB = { tree: [15, 52], fruitTree: [14, 44], bush: [12, 17], boulder: [13, 18], grass: [10, 12], fire: [12, 18], hut: [22, 36], basket: [10, 17], cairn: [8, 21], sprout: [9, 22], pile: [9, 12] };
function hitObject(wx, wy) {
  let best = null, bd = -1e9;
  for (const o of W.objs) {
    const [bx, by] = iso((o.x + .5) * U, (o.y + .5) * U, topZ(o.x, o.y)), [w, h] = HB[o.type] || [10, 10];

}
function hitYeren(wx, wy) {
  let best = null, bd = 1e9;
  for (const y of AIS) { const [sx, sy] = iso(y.x, y.y, y.z + 20); const dx = Math.abs(wx - sx), dy = Math.abs(wy - sy); if (dx < 12 && dy < 24 && dx + dy < bd) { bd = dx + dy; best = y; } }
  return best;
}
function hitFish(wx, wy) { for (const f of FISH) { const [sx, sy] = iso(f.x, f.y, WATER_Z); if (Math.hypot(wx - sx, wy - sy) < 14) return f; } return null; }
let down = null, lastTap = { t: 0, key: '' };
cvs.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY }; });
cvs.addEventListener('pointerup', e => {
  if (!down) return; const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y); down = null;
  if (moved < 14) onTap(e.clientX, e.clientY, e.shiftKey);
});
function onTap(px, py, sh) {
  if (sheetKind) { closeSheet(); return; }
  if (ME.sleeping) { wakePlayer(); toast('起床了'); return; }
  const [wx, wy] = toWorld(px, py);
  const tp = pickTile(px, py);
  if (placeMode) {
    const hit = tp && placeMode.tiles.find(t => t[0] === tp[0] && t[1] === tp[1]);
    if (hit && !ME.moving) doPlace(tp[0], tp[1]); else { placeMode = null; toast('取消放置'); }
    return;
  }
  let g = null, key = '';
  const y = hitYeren(wx, wy);
  if (y) { g = { kind: 'yeren', y }; key = 'y' + y.name; }
  else if (pet && Math.hypot(wx - iso(pet.x, pet.y, pet.z + 6)[0], wy - iso(pet.x, pet.y, pet.z + 6)[1]) < 10) { pet.emo = { e: '❤️', t: 0, dur: 1500 }; ME.emote('😊', 1200); return; }
  else {
    const f = hitFish(wx, wy);
    if (f) { g = { kind: 'fish', f, x: Math.floor(f.x / U), y: Math.floor(f.y / U) }; key = 'f'; }
    else {
      const o = hitObject(wx, wy);
      if (o) { g = { kind: 'obj', o }; key = 'o' + o.id; }
      else if (tp) {
        const po = objAt(tp[0], tp[1]);
        if (po) { g = { kind: 'obj', o: po }; key = 'o' + po.id; }
        else { g = { kind: 'walk', x: tp[0], y: tp[1] }; key = 't' + tp[0] + ',' + tp[1]; }
      }
    }
  }
  if (!g) return;
  const now = performance.now(), dbl = now - lastTap.t < 380 && key === lastTap.key;
  lastTap = { t: now, key };
  setGoal(g, sh || dbl || (tag && g.kind === 'yeren'));
}

/* =========================================================
   繪製
   ========================================================= */
function worldXf() { ctx.setTransform(DPR * zoom, 0, 0, DPR * zoom, DPR * (VW / 2 - cam.x * zoom), DPR * (VH / 2 - cam.y * zoom)); }
const toScreen = p => [(p[0] - cam.x) * zoom + VW / 2, (p[1] - cam.y) * zoom + VH / 2];
const BUCKETS = Array.from({ length: MAP_W + MAP_H - 1 }, () => []);
function render(time) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#15222b'; ctx.fillRect(0, 0, VW, VH);
  worldXf(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  for (const b of BUCKETS) b.length = 0;
  for (const o of W.objs) BUCKETS[o.x + o.y].push({ d: (o.x + o.y + 1) * U + (o.type === 'pile' ? -6 : 0), f: () => drawObj(ctx, o, time) });
  for (const f of FISH) { const tx = clamp(Math.floor(f.x / U), 0, MAP_W - 1), ty = clamp(Math.floor(f.y / U), 0, MAP_H - 1); BUCKETS[tx + ty].push({ d: f.x + f.y - 10, f: () => drawFish(ctx, f) }); }
  for (const y of ALL) BUCKETS[clamp(y.sortKey(), 0, BUCKETS.length - 1)].push({ d: y.x + y.y + 2, f: () => y.draw(ctx) });
  if (pet) { const tx = clamp(Math.floor(pet.x / U), 0, MAP_W - 1), ty = clamp(Math.floor(pet.y / U), 0, MAP_H - 1); BUCKETS[tx + ty].push({ d: pet.x + pet.y + 1, f: () => drawPet(ctx) }); }
  const pulse = 0.75 + 0.2 * Math.sin(time * 0.008);
  for (let s = 0; s <= MAP_W + MAP_H - 2; s++) {
    for (let x = Math.max(0, s - MAP_H + 1); x <= Math.min(MAP_W - 1, s); x++) {
      const y = s - x; drawTile(ctx, x, y, time);
      if (target && target.x === x && target.y === y) tileDiamond(ctx, x, y, targetBad > 0 ? 'rgba(255,90,70,.9)' : 'rgba(255,255,255,.8)', pulse);
      if (placeMode && placeMode.tiles.some(t => t[0] === x && t[1] === y)) { tileDiamond(ctx, x, y, 'rgba(150,255,140,.95)', 0.85 + 0.1 * Math.sin(time * 0.01), 1.8); }
    }
    const L = BUCKETS[s];
    if (L.length) { L.sort((a, b) => a.d - b.d); for (const e of L) e.f(); }
  }
  drawFx(ctx);
  drawNight(time);
  worldXf(); drawOverlays(time);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); drawArrow(time);
}
function drawNight(time) {
  const dk = darkness(), tint = duskTint();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (tint > 0.005) { ctx.fillStyle = `rgba(255,120,50,${tint})`; ctx.fillRect(0, 0, VW, VH); }
  if (dk < 0.01) return;
  const d = dctx; d.setTransform(DPR, 0, 0, DPR, 0, 0);
  d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, VW, VH);
  d.fillStyle = `rgba(8,14,40,${dk})`; d.fillRect(0, 0, VW, VH);
  d.globalCompositeOperation = 'destination-out';
  const light = (wx, wy, wz, r, a) => {
    const [sx, sy] = toScreen(iso(wx, wy, wz)), R = r * zoom, g = d.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(0.55, `rgba(0,0,0,${a * 0.65})`); g.addColorStop(1, 'rgba(0,0,0,0)');
    d.fillStyle = g; d.beginPath(); d.arc(sx, sy, R, 0, TAU); d.fill();
  };
  const fires = [];
  for (const o of W.objs) {
    if (o.type === 'fire' && o.fuel > 0) { const fl = 1 + Math.sin(time * 0.013 + o.id) * 0.04 + Math.sin(time * 0.031) * 0.03; const r = 88 * fl * (0.6 + 0.4 * Math.min(1, o.fuel / 30)); light((o.x + .5) * U, (o.y + .5) * U, topZ(o.x, o.y) + 8, r, 1); fires.push([o, r]); }
    if (o.type === 'pile' && o.k === 'egg') light((o.x + .5) * U, (o.y + .5) * U, topZ(o.x, o.y) + 6, 30, 0.6);
  }
  for (const y of ALL) light(y.x, y.y, y.z + 16, 26, 0.5);
  d.globalCompositeOperation = 'source-over';
  ctx.drawImage(dark, 0, 0, VW, VH);
  ctx.globalCompositeOperation = 'lighter';
  for (const [o, r] of fires) {
    const [sx, sy] = toScreen(iso((o.x + .5) * U, (o.y + .5) * U, topZ(o.x, o.y) + 6)), R = r * 0.7 * zoom, g = ctx.createRadialGradient(sx, sy, 0, sx, sy, R);
    g.addColorStop(0, `rgba(255,140,50,${0.22 * dk / 0.7})`); g.addColorStop(1, 'rgba(255,120,40,0)');

function bubble(c, x, y, e, a) {

  c.beginPath(); c.moveTo(x - 2, y - 2.2); c.lineTo(x, y + 1); c.lineTo(x + 2, y - 2.2); c.closePath(); c.fill();
  c.font = `9px ${EMO_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillStyle = '#000';
  c.fillText(e, x, y - 8.3);

}
function drawOverlays(time) {

    ctx.lineWidth = 2.2; ctx.strokeStyle = 'rgba(40,20,10,.8)'; ctx.strokeText(f.txt, x, y); ctx.fillStyle = f.c; ctx.fillText(f.txt, x, y);
  }

}
function taskTarget() {
  if (taskIdx >= TASKS.length) return null;
  const id = TASKS[taskIdx].id;
  if (id !== 'plateau' && id !== 'egg') return null;
  const egg = W.objs.find(o => o.type === 'pile' && o.k === 'egg');
  if (egg && !(id === 'egg' && egg.warm > 0)) return { p: iso((egg.x + .5) * U, (egg.y + .5) * U, topZ(egg.x, egg.y) + 10), e: '🥚' };
  if (id === 'egg' && bagCount(ME, 'egg')) { const f = W.objs.find(o => o.type === 'fire'); if (f) return { p: iso((f.x + .5) * U, (f.y + .5) * U, topZ(f.x, f.y) + 12), e: '🔥' }; }
  return null;
}
function drawArrow(time) {
  const T = taskTarget(); if (!T) return;
  const [sx, sy] = toScreen(T.p), m = 46;
  const c = ctx; c.font = `18px ${EMO_FONT}`; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (sx > m && sx < VW - m && sy > m + 60 && sy < VH - m - 60) {
    const b = Math.sin(time * 0.006) * 3; c.fillStyle = 'rgba(255,230,150,.95)';
    c.beginPath(); c.moveTo(sx - 6, sy - 26 + b); c.lineTo(sx + 6, sy - 26 + b); c.lineTo(sx, sy - 17 + b); c.closePath(); c.fill();
    return;
  }
  const cx = VW / 2, cy = VH / 2, a = Math.atan2(sy - cy, sx - cx);
  const ex = clamp(cx + Math.cos(a) * VW, m, VW - m), ey = clamp(cy + Math.sin(a) * VH, m + 70, VH - m - 70);
  c.save(); c.translate(ex, ey);
  c.fillStyle = 'rgba(16,24,30,.8)'; c.beginPath(); c.arc(0, 0, 17, 0, TAU); c.fill();
  c.fillText(T.e, 0, 1);
  c.rotate(a); c.fillStyle = 'rgba(255,220,140,.95)'; c.beginPath(); c.moveTo(24, 0); c.lineTo(16, -6); c.lineTo(16, 6); c.closePath(); c.fill();

}

/* =========================================================
   存檔
   ========================================================= */
function makeYerens(saved) {
  const spotNear = (dx, dy) => {
    const tx = clamp(START[0] + dx, 1, MAP_W - 2), ty = clamp(START[1] + dy, 1, MAP_H - 2);
    const r = seek({ tx, ty }, (x, y) => !isBlocked(x, y) && !map[y][x].water && !yerenAt(x, y, null) ? [x, y] : null, { maxD: 12 });
    return r ? r.target : START;
  };
  ALL = []; AIS = [];
  ME = new Yeren(START[0], START[1], { name: '我', me: true, cap: 24 });
  ALL.push(ME);
  for (const per of PERSONAS) {
    const [x, y] = spotNear(per.spawn[0], per.spawn[1]);
    const a = new Yeren(x, y, { name: per.name, col: per.col, hair: per.hair, band: per.band, cap: 8 });
    a.hunger = rnd(65, 90);
    a.ai = { per, plan: [], cur: null, goal: 'idle', seen: new Set(), thinkT: 0, aff: { '我': 20 }, giftCD: 60000, greeted: false, gifts: 0 };
    for (const o of PERSONAS) if (o !== per) a.ai.aff[o.name] = 50;
    AIS.push(a); ALL.push(a);
  }
  if (saved) saved.forEach((s, i) => {
    const y = ALL[i]; if (!y || !s) return;
    if (inB(s.tx, s.ty) && !isBlocked(s.tx, s.ty)) { y.tx = y.fx = s.tx; y.ty = y.fy = s.ty; y.x = (s.tx + .5) * U; y.y = (s.ty + .5) * U; y.gz = groundZ(s.tx, s.ty); }
    y.face = y.faceT = s.face || 0;
    Object.assign(y, { hunger: s.hunger, energy: s.energy, fun: s.fun, social: s.social });
    y.bag = (s.bag || []).filter(b => IT[b.k] && b.n > 0); y.sel = s.sel && bagCount(y, s.sel) ? s.sel : null;
    if (y.ai && s.ai) Object.assign(y.ai, { aff: Object.assign(y.ai.aff, s.ai.aff), greeted: !!s.ai.greeted, gifts: s.ai.gifts || 0, giftCD: s.ai.giftCD || 0 });
    y.computePose(); y.resetHair(); y.updateLayers(true);
  });
}
function saveGame() {

    const d = {
      v: 1, seed: SEED, clock, gameT, lastDay, taskIdx, ST, dST, daily, nid: W.nid,
      lv: map.map(r => r.map(t => t.water ? -1 : t.lv)),
      objs: W.objs.map(o => { const c = Object.assign({}, o); if (c.type === 'hut') c.occ = null; delete c.shake; return c; }),
      ys: ALL.map(y => ({ tx: y.tx, ty: y.ty, face: y.faceT, hunger: y.hunger, energy: y.energy, fun: y.fun, social: y.social, bag: y.bag, sel: y.sel || null, ai: y.ai ? { aff: y.ai.aff, greeted: y.ai.greeted, gifts: y.ai.gifts, giftCD: y.ai.giftCD } : null })),
      pet: pet ? { x: pet.x, y: pet.y } : null,

    localStorage.setItem(SAVE_KEY, JSON.stringify(d));
  } catch (e) { }
}
function loadGame() {
  let d = null;
  try { d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); } catch (e) { d = null; }
  if (!d || d.v !== 1) return false;
  try {
    SEED = d.seed; genTerrain(SEED);
    d.lv.forEach((r, y) => r.forEach((v, x) => { const t = map[y][x]; if (v < 0) { t.water = true; t.lv = 0; } else { t.water = false; t.lv = v; } }));
    resetWorld(); d.objs.forEach(o => addObj(o)); W.nid = Math.max(W.nid, d.nid || 1);
    clock = d.clock; gameT = d.gameT || 0; lastDay = d.lastDay || dayNum(); taskIdx = d.taskIdx || 0;
    ST = Object.assign(freshStats(), d.ST); dST = d.dST || {}; daily = d.daily || null;
    makeYerens(d.ys);

}
function newGame() {
  SEED = (Math.random() * 1e9) | 0;
  const R = genTerrain(SEED); resetWorld(); placeObjects(R);
  clock = DAY_MS * (1.5 / 24); gameT = 0; lastDay = 1; taskIdx = 0; ST = freshStats(); dST = {}; daily = null; pet = null;
  makeYerens(null);
}

/* =========================================================
   主迴圈
   ========================================================= */
const hadSave = loadGame();
if (!hadSave) newGame();
initFishTiles(); FISH.length = 0; for (let i = 0; i < 6; i++) spawnFish();
{ const [cx, cy] = iso(ME.x, ME.y, ME.gz); cam.x = cx; cam.y = cy - 20; }
buildFriends(); refreshBag(); refreshTask();
if (!hadSave) openHelp(); else toast(`歡迎回來！第 ${dayNum()} 天`);
addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
addEventListener('pagehide', saveGame);

let last = performance.now(), uiT = 0, saveT = 0;
function loop(now) {
  let rdt = Math.min(50, now - last); last = now;
  if (slow) rdt *= 0.25;
  const wdt = rdt * timeScale();
  gameT += rdt; clock += wdt;
  if (dayNum() > lastDay) newDay();
  updateWorld(wdt, rdt);
  for (const y of ALL) updateNeeds(y, wdt);
  ME.hold = ME.sel;
  for (const y of ALL) y.update(rdt);
  control();
  for (const a of AIS) aiUpdate(a, rdt);
  updateFish(rdt); updatePet(rdt); updateFx(rdt); updateTag(rdt); sleepCheck();
  if (!ST.plateau && map[ME.ty][ME.tx].plat) { ST.plateau = true; toast('⛰️ 登上高台了！上面有一顆發亮的蛋…', true); ME.doAnim('cheer', 1200); }
  if (placeMode && (ME.moving || manh(ME.tx, ME.ty, ME.fx, ME.fy) > 0 && ME.moving)) placeMode = null;
  if (targetBad > 0) { targetBad -= rdt; if (targetBad <= 0) target = null; }
  const [cx, cy] = iso(ME.x, ME.y, ME.gz), k = 1 - Math.exp(-rdt * 0.006);
  cam.x += (cx - cam.x) * k; cam.y += (cy - 20 - cam.y) * k;
  render(gameT);
  uiT -= rdt; if (uiT <= 0) { uiT = 200; refreshStat(); refreshFriends(); refreshAct(); checkTasks(); refreshTask(); }
  saveT += rdt; if (saveT > 15000) { saveT = 0; saveGame(); }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
