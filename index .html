<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#bfe6f5">
<title>小星球郵差</title>
<link rel="icon" href="data:,">
<style>
:root{
  --ink:#4a3b52; --ink2:#7a6a80; --cream:#fffaf0; --card:rgba(255,250,240,.93);
  --accent:#ff8b6b; --accent-d:#e8704f; --mint:#7bc8a4; --sky:#8fd0f7; --yellow:#ffd36e;
  --shadow:0 6px 18px rgba(74,59,82,.18); --r:16px;
  --font:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC","Noto Sans CJK TC",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6f5;font-family:var(--font);color:var(--ink);
  user-select:none;-webkit-user-select:none;touch-action:none;overscroll-behavior:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
#ui{position:fixed;inset:0;pointer-events:none;z-index:2}
#ui button,#ui .interactive{pointer-events:auto}
.hidden{display:none!important}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
kbd{display:inline-block;min-width:1.6em;padding:1px 6px;border-radius:6px;background:#fff;border:2px solid #e3d7cc;
  border-bottom-width:3px;font:700 13px/1.3 var(--font);text-align:center;color:var(--ink)}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);border:2px solid rgba(255,255,255,.85)}

/* ---------- loading ---------- */
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  background:linear-gradient(#bfe6f5,#e9f7ef);z-index:50;pointer-events:auto;transition:opacity .6s}
#loading.fade{opacity:0;pointer-events:none}
.ld-planet{width:76px;height:76px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#bff0a8,#6fbf73 60%,#4f9d61);
  box-shadow:0 8px 20px rgba(74,59,82,.2);position:relative;animation:ldspin 2.4s linear infinite}
.ld-planet:after{content:"";position:absolute;left:-14px;top:30px;width:104px;height:16px;border-radius:50%;border:3px solid #ffd36e;transform:rotate(-14deg)}
@keyframes ldspin{to{transform:rotate(360deg)}}
.ld-text{font-weight:700;letter-spacing:2px}
#ld-err{max-width:80vw;color:#c0392b;font-size:13px;white-space:pre-wrap}

/* ---------- HUD ---------- */
#hud-left{position:absolute;left:max(12px,env(safe-area-inset-left));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;gap:8px;width:min(290px,58vw)}
#quest-card{padding:10px 14px;cursor:pointer}
.qc-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--ink2);font-weight:700}
.qc-label{background:var(--yellow);color:var(--ink);border-radius:999px;padding:1px 8px}
#qc-dist{font-variant-numeric:tabular-nums}
#qc-title{font-weight:800;font-size:16px;margin-top:4px}
#qc-step{font-size:13px;color:var(--ink2);margin-top:2px;line-height:1.35}
#bag{padding:8px 12px;display:flex;align-items:center;gap:10px}
.bag-head{font-size:12px;font-weight:800;color:var(--ink2);white-space:nowrap}
#bag-slots{display:flex;gap:6px}
.slot{width:40px;height:40px;border-radius:10px;background:rgba(122,106,128,.12);border:2px dashed rgba(122,106,128,.3);display:flex;align-items:center;justify-content:center;position:relative}
.slot.full{background:#fff;border:2px solid var(--yellow);animation:pop .35s}
.slot img{width:30px;height:30px}
.slot .tip{position:absolute;top:44px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:11px;padding:2px 6px;border-radius:6px;white-space:nowrap;opacity:0;transition:opacity .2s;pointer-events:none}
.slot:hover .tip{opacity:1}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
#hud-right{position:absolute;right:max(12px,env(safe-area-inset-right));top:max(12px,env(safe-area-inset-top));display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;box-shadow:var(--shadow);display:flex;align-items:center;gap:6px}
.pill b{font-size:15px}
.dot{width:9px;height:9px;border-radius:50%;background:#4cd17a;box-shadow:0 0 0 3px rgba(76,209,122,.25)}
.btn-row{display:flex;gap:6px;margin-top:2px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;transition:transform .12s}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn.off svg .wave{display:none}
#prompt{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:var(--card);border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center;white-space:nowrap;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#key-hints{position:absolute;left:12px;bottom:12px;padding:8px 12px;font-size:12px;color:var(--ink2);transition:opacity 1s;max-width:60vw;line-height:1.6}
#key-hints.fade{opacity:0}
.round-btn{position:absolute;width:58px;height:58px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;border:2px solid #fff;touch-action:none}
.round-btn:active{transform:scale(.92)}
.round-btn svg{width:30px;height:30px;stroke:var(--ink);fill:none;stroke-width:2.2;stroke-linecap:round}
#btn-emote{right:18px;bottom:18px}
body.touch #btn-emote{right:150px;bottom:30px;width:52px;height:52px}
#touch{position:absolute;inset:0;pointer-events:none}
#joy-zone{position:absolute;left:0;bottom:0;width:45%;height:58%;pointer-events:auto;touch-action:none}
#joy-base{position:absolute;left:36px;bottom:36px;width:124px;height:124px;border-radius:50%;background:rgba(255,250,240,.45);border:3px solid rgba(255,255,255,.8);box-shadow:var(--shadow)}
#joy-knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--card);box-shadow:0 3px 8px rgba(74,59,82,.3)}
#btn-jump{right:26px;bottom:30px;width:84px;height:84px;font-size:18px;background:var(--yellow)}
#btn-act{right:122px;bottom:96px;width:64px;height:64px;background:#fff}
#btn-act.ready{background:var(--mint);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(123,200,164,.35)}}

/* ---------- navigation ---------- */
#nav-marker{position:absolute;left:0;top:0;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;gap:2px;will-change:transform}
.nm-pin{width:34px;height:34px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--accent);box-shadow:0 3px 8px rgba(74,59,82,.35);display:flex;align-items:center;justify-content:center;border:2px solid #fff}
.nm-pin svg{transform:rotate(45deg);width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linejoin:round}
.nm-dist,.na-dist{font-size:12px;font-weight:800;color:#fff;text-shadow:0 1px 3px rgba(74,59,82,.8);font-variant-numeric:tabular-nums;white-space:nowrap}
#nav-arrow{position:absolute;left:0;top:0;width:0;height:0;will-change:transform}
.na-arrow{position:absolute;left:-22px;top:-22px;width:44px;height:44px;border-radius:50%;background:var(--accent);border:3px solid #fff;box-shadow:0 3px 10px rgba(74,59,82,.35)}
.na-arrow:after{content:"";position:absolute;left:14px;top:10px;border-left:16px solid #fff;border-top:9px solid transparent;border-bottom:9px solid transparent}
.na-dist{position:absolute;left:-30px;width:60px;text-align:center;top:26px}

/* ---------- toasts ---------- */
#toasts{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top));transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(420px,70vw)}
.toast{background:var(--ink);color:#fff;padding:8px 16px;border-radius:999px;font-size:14px;font-weight:700;box-shadow:var(--shadow);animation:tin .3s ease-out;transition:opacity .4s,transform .4s;text-align:center}
.toast.good{background:var(--mint)}
.toast.warn{background:var(--accent)}
.toast.out{opacity:0;transform:translateY(-8px)}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}

/* ---------- emote wheel ---------- */
#emote-wheel{position:absolute;inset:0;pointer-events:auto;background:rgba(74,59,82,.08)}
.ew-ring{position:absolute;left:50%;top:50%;width:0;height:0}
.ew-btn{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;animation:pop .25s}
.ew-btn img{width:50px;height:50px}
.ew-btn .k{position:absolute;right:-2px;bottom:-2px;background:var(--ink);color:#fff;border-radius:6px;font-size:11px;padding:0 5px;font-weight:700}
.ew-close{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--ink);color:#fff;font-size:22px;line-height:44px;text-align:center}

/* ---------- dialog ---------- */
#dialog{position:absolute;left:50%;bottom:max(22px,env(safe-area-inset-bottom));transform:translateX(-50%);width:min(680px,calc(100% - 28px));
  background:var(--cream);border-radius:20px;box-shadow:0 10px 30px rgba(74,59,82,.28);border:3px solid #fff;padding:22px 22px 18px;cursor:pointer;animation:dlgin .25s ease-out;pointer-events:auto}
body.dlg #touch,body.dlg #btn-emote,body.dlg #prompt{display:none}
@keyframes dlgin{from{opacity:0;transform:translate(-50%,16px)}}
.dlg-name{position:absolute;left:18px;top:-16px;background:var(--accent);color:#fff;font-weight:800;padding:4px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:15px}
.dlg-name small{font-weight:600;opacity:.85;margin-left:6px;font-size:12px}
.dlg-text{font-size:17px;line-height:1.6;min-height:3.2em}
.dlg-next{position:absolute;right:18px;bottom:8px;color:var(--accent);animation:bob2 .8s ease-in-out infinite;font-size:14px}
@keyframes bob2{50%{transform:translateY(3px)}}

/* ---------- modals & panels ---------- */
.modal{position:absolute;inset:0;background:rgba(74,59,82,.28);display:flex;align-items:center;justify-content:center;pointer-events:auto;padding:16px}
.modal-card{background:var(--cream);border-radius:22px;box-shadow:0 12px 34px rgba(74,59,82,.3);border:3px solid #fff;width:min(520px,100%);max-height:86vh;overflow:auto;padding:18px 20px;animation:pop .25s}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.modal-head h2{margin:0;font-size:20px}
.close-btn{width:34px;height:34px;border-radius:50%;background:#efe4da;font-size:20px;line-height:34px}
.q-sec{font-size:12px;font-weight:800;color:var(--ink2);margin:12px 0 6px;letter-spacing:1px}
.q-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:#fff;margin-bottom:6px;border:2px solid transparent;cursor:pointer;text-align:left;width:100%}
.q-item.tracked{border-color:var(--accent);background:#fff4ee}
.q-item.done{opacity:.6;cursor:default}
.q-ico{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:900;color:#fff;background:var(--sky)}
.q-item.avail .q-ico{background:var(--yellow);color:var(--ink)}
.q-item.done .q-ico{background:var(--mint)}
.q-t{font-weight:800}
.q-d{font-size:13px;color:var(--ink2);margin-top:2px}
.q-tag{margin-left:auto;font-size:11px;font-weight:800;color:var(--accent);white-space:nowrap}
.btn{display:block;width:100%;padding:12px 16px;border-radius:14px;background:#fff;font-size:16px;font-weight:800;box-shadow:0 3px 0 #e3d7cc;margin-top:10px;transition:transform .1s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #e3d7cc}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 var(--accent-d)}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0}
.side-panel{position:absolute;left:max(16px,env(safe-area-inset-left));top:16px;bottom:16px;width:min(390px,calc(100% - 32px));background:var(--cream);border-radius:22px;
  box-shadow:0 12px 34px rgba(74,59,82,.3);border:3px solid #fff;overflow:auto;padding:18px 20px;pointer-events:auto;animation:slin .3s ease-out}
@keyframes slin{from{opacity:0;transform:translateX(-20px)}}
.of-row{margin:10px 0}
.of-label{font-size:13px;font-weight:800;color:var(--ink2);margin-bottom:6px}
.of-opts{display:flex;flex-wrap:wrap;gap:7px}
.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #e3d7cc}
.sw.sel{box-shadow:0 0 0 3px var(--accent)}
.chip{padding:6px 12px;border-radius:999px;background:#fff;font-size:14px;font-weight:700;box-shadow:0 0 0 2px #e3d7cc}
.chip.sel{background:var(--accent);color:#fff;box-shadow:0 0 0 2px var(--accent)}
.set-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:2px dashed #efe4da;font-weight:700}

/* ---------- start ---------- */
#start{position:absolute;inset:0;pointer-events:none}
.start-panel{position:absolute;left:max(18px,env(safe-area-inset-left));top:18px;bottom:18px;width:min(410px,calc(100% - 36px));background:var(--card);border-radius:26px;
  box-shadow:0 12px 34px rgba(74,59,82,.28);border:3px solid #fff;overflow:auto;padding:22px 22px 18px;pointer-events:auto}
.logo{display:flex;align-items:center;gap:12px}
.logo-mark{width:54px;height:54px;border-radius:16px;background:var(--accent);display:flex;align-items:center;justify-content:center;transform:rotate(-6deg);box-shadow:0 4px 0 var(--accent-d)}
.logo-mark svg{width:34px;height:34px;stroke:#fff;fill:none;stroke-width:2.4;stroke-linejoin:round}
h1{margin:0;font-size:30px;letter-spacing:3px}
.sub{margin:2px 0 0;color:var(--ink2);font-size:13px;letter-spacing:1px}
.start-desc{font-size:14px;color:var(--ink2);line-height:1.6;margin:12px 0 4px}
details{margin-top:12px;font-size:13px;color:var(--ink2);line-height:1.8;background:#fff;border-radius:14px;padding:8px 12px}
summary{font-weight:800;color:var(--ink);cursor:pointer}
.start-btns{display:flex;flex-direction:column;position:sticky;bottom:-18px;margin:0 -22px -18px;padding:6px 22px 16px;
  background:linear-gradient(rgba(255,250,240,0),var(--cream) 22%);z-index:2}
#outfit-done{position:sticky;bottom:-18px;box-shadow:0 3px 0 var(--accent-d),0 -10px 14px var(--cream)}

/* ---------- ending ---------- */
#ending{position:absolute;inset:0;pointer-events:auto;background:linear-gradient(180deg,rgba(255,214,186,.96),rgba(191,230,245,.96));overflow:hidden;animation:fadein 1.2s}
@keyframes fadein{from{opacity:0}}
.credits{position:absolute;left:50%;top:100%;transform:translateX(-50%);width:min(520px,90vw);text-align:center;animation:roll 30s linear forwards}
@keyframes roll{to{top:-160%}}
.credits h2{font-size:34px;letter-spacing:4px;margin:0 0 6px}
.credits h3{font-size:15px;color:var(--ink2);margin:34px 0 6px;letter-spacing:2px}
.credits p{margin:4px 0;font-size:17px}
#ending-continue{position:absolute;left:50%;bottom:max(26px,env(safe-area-inset-bottom));transform:translateX(-50%);width:auto;padding:12px 28px}

@media (max-aspect-ratio: 1/1){
  .start-panel,.side-panel{left:0;right:0;width:auto;top:auto;bottom:0;height:56%;border-radius:26px 26px 0 0;padding:16px 18px max(18px,env(safe-area-inset-bottom))}
  .start-btns{margin:0 -18px -18px;padding:6px 18px max(16px,env(safe-area-inset-bottom))}
  h1{font-size:24px}
  .logo-mark{width:44px;height:44px}.start-desc{display:none}
  .of-row{margin:7px 0}.sw{width:28px;height:28px}.chip{padding:5px 10px;font-size:13px}
  #hud-left{width:min(250px,56vw)}
  #qc-title{font-size:14px}
  .slot{width:34px;height:34px}.slot img{width:26px;height:26px}
  #key-hints{display:none}
  .btn-row{flex-direction:column}
  #toasts{top:auto;bottom:200px}
}
@media (max-height: 520px){
  #prompt{bottom:84px}
  #btn-jump{width:70px;height:70px}
}
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>
<div id="ui">
  <div id="loading"><div class="ld-planet"></div><div class="ld-text">小星球準備中…</div><div id="ld-err"></div></div>

  <div id="hud" class="hidden">
    <div id="hud-left">
      <div id="quest-card" class="card interactive" title="任務清單 (Tab)">
        <div class="qc-head"><span class="qc-label">追蹤中</span><span id="qc-dist"></span></div>
        <div id="qc-title">沒有追蹤的任務</div>
        <div id="qc-step">按 Tab 打開任務清單</div>
      </div>
      <div id="bag" class="card interactive">
        <div class="bag-head">郵差包<br><span id="bag-count">0/3</span></div>
        <div id="bag-slots"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
      </div>
    </div>
    <div id="hud-right">
      <div class="pill"><span class="dot"></span><span id="online-count">線上 1 人</span></div>
      <div class="pill">已送達 <b id="done-count">0</b>/10</div>
      <div class="btn-row">
        <button class="icon-btn" id="btn-quests" title="任務清單 (Tab)"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></button>
        <button class="icon-btn" id="btn-outfit" title="換裝 (C)"><svg viewBox="0 0 24 24"><path d="M8 3l-5 3 2 4 2-1v12h10V9l2 1 2-4-5-3c0 2-2 3-4 3s-4-1-4-3z"/></svg></button>
        <button class="icon-btn" id="btn-mute" title="靜音 (M)"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path class="wave" d="M16 9c1.5 1.5 1.5 4.5 0 6M18.5 6.5c3 3 3 8 0 11"/></svg></button>
        <button class="icon-btn" id="btn-pause" title="暫停 (Esc)"><svg viewBox="0 0 24 24"><path d="M9 5v14M15 5v14"/></svg></button>
      </div>
    </div>
    <div id="prompt" class="hidden"><kbd>E</kbd><span id="prompt-text"></span></div>
    <div id="key-hints" class="card"><kbd>WASD</kbd> 移動　<kbd>Shift</kbd> 跑　<kbd>Space</kbd> 跳　<kbd>E</kbd> 對話<br><kbd>Tab</kbd> 任務　<kbd>C</kbd> 換裝　<kbd>1</kbd>–<kbd>6</kbd> 表情　拖曳滑鼠轉視角、滾輪縮放</div>
    <div id="touch" class="hidden">
      <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
      <button id="btn-act" class="round-btn">說話</button>
      <button id="btn-jump" class="round-btn">跳</button>
    </div>
    <button id="btn-emote" class="round-btn" title="表情 (1-6)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 14c1 2 2.5 3 4 3s3-1 4-3"/><path d="M9 9.5h.01M15 9.5h.01" stroke-width="3"/></svg></button>
  </div>

  <div id="nav-marker" class="hidden"><div class="nm-pin"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div><div class="nm-dist">0 m</div></div>
  <div id="nav-arrow" class="hidden"><div class="na-arrow"></div><div class="na-dist"></div></div>
  <div id="toasts"></div>
  <div id="emote-wheel" class="hidden"><div class="ew-ring"></div></div>
  <div id="dialog" class="hidden"><div class="dlg-name"></div><div class="dlg-text"></div><div class="dlg-next">▼ 點一下繼續</div></div>

  <div id="panel-quests" class="modal hidden"><div class="modal-card">
    <div class="modal-head"><h2>任務清單</h2><button class="close-btn" data-close>×</button></div>
    <div style="font-size:13px;color:var(--ink2)">點選任務即可設為「追蹤中」，畫面上會出現導引。</div>
    <div id="quest-list"></div>
  </div></div>

  <div id="panel-outfit" class="side-panel hidden">
    <div class="modal-head"><h2>換裝</h2><button class="close-btn" data-close>×</button></div>
    <div id="outfit-slot-game"></div>
    <button class="btn primary" id="outfit-done">完成</button>
  </div>

/* =========================================================================

  if (dl > K.L0) {

function regionAt(d) {
  let best = null, bv = 0;
  for (const r of REGIONS) { const v = d.dot(r.c) - r.cosR; if (v > bv) { bv = v; best = r; } }
  return best;
}
const regionName = d => { const r = regionAt(d); return r ? r.name : '草原'; };

/* ---------- 步道（大圓弧） ---------- */
const PATHS = [];

}
(function buildPaths() {
  const P = RG.plaza.c, T = RG.town.c, F = RG.forest.c, W = RG.power.c;
  addPathArc(P, T); addPathArc(P, F); addPathArc(P, lakeEntry(P));
  addPathArc(F, W); addPathArc(T, W); addPathArc(T, lakeEntry(T));

const C = (h) => new THREE.Color(h);
const GC = {
  meadow: C('#9fd47c'), sand: C('#f1dfa8'), lakebed: C('#7fbfb2'), path: C('#ecd9ad'),
  stone1: C('#efe4d6'), stone2: C('#dccfc0'),
};
function groundColor(d, hh, out) {
  out.copy(GC.meadow);
  for (const r of REGIONS) {
    const w = smooth(r.cosO, r.cosI, d.dot(r.c));
    if (w > 0) out.lerp(r.color, w);
  }
  const nv = Noise.noise3(d.x * 11 + 3, d.y * 11, d.z * 11 - 2);
  out.multiplyScalar(1 + nv * 0.16 + hh * 0.035);

    out.lerp(GC.sand, smooth(-0.12, -0.45, hh) * lakeW);

  if (dp > K.STONE) {

    const ring = Math.floor(Math.acos(Math.min(1, dp)) * R / 1.3);

}
/** 星球網格：頂點以同一個 h(dir) 位移，並烘焙頂點色 */
function buildPlanetMesh() {
  let g = new THREE.IcosahedronGeometry(1, CFG.planetDetail);
  g.deleteAttribute('normal'); g.deleteAttribute('uv');
  g = mergeVertices(g);
  const pos = g.attributes.position, col = new Float32Array(pos.count * 3);
  const d = new V3(), c = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    d.fromBufferAttribute(pos, i).normalize();
    const hh = terrainH(d);
    groundColor(d, hh, c);
    pos.setXYZ(i, d.x * (R + hh), d.y * (R + hh), d.z * (R + hh));
    col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;

  g.computeVertexNormals(); g.computeBoundingSphere();

  mesh.receiveShadow = true; mesh.name = 'planet';

/* =========================================================================
 *  Materials — Toon + 3 階 gradient map、描邊材質
 * ========================================================================= */
function makeGradientMap() {

  const t = new THREE.DataTexture(data, 3, 1, THREE.RGBAFormat);

  m.userData.th = { value: th };
  m.onBeforeCompile = (s) => {
    s.uniforms.uTh = m.userData.th;
    s.vertexShader = 'uniform float uTh;\n' + s.vertexShader.replace('#include <begin_vertex>', 'vec3 transformed = vec3( position ) + normal * uTh;');

/* =========================================================================

    for (const g of groups) {

  /** 長椅有左右兩個座位；lift 用於放在岩石平台上（相對地形的高度），noBots 表示假玩家不會去坐 */
  addBench(d, fwd, reserved = false, lift = 0, noBots = false) {
    this.I('bench').add(surfaceMatrix(d, fwd, 1, 0.04, new THREE.Matrix4(), lift));
    const right = this.right(d, fwd);
    for (const s of [-0.42, 0.42]) this.col.add(SM.along(SM.along(d, right, s, new V3()), fwd, -0.05, new V3()), 0.42, 'bench');
    const baseR = R + terrainH(d) + lift - 0.04, seats = [];
    for (const s of [-0.4, 0.4]) {
      const sd = SM.along(SM.along(d, right, s, new V3()), fwd, 0.04, new V3());
      const seat = { seat: sd, fwd: fwd.clone(), approach: SM.along(sd, fwd, 1.15, new V3()), taken: null, lift, baseR, noBots };
      seats.push(seat); this.benches.push(seat);
    }
    if (reserved) seats[0].taken = 'npc';
    return seats;
  }
  addFenceRun(start, dirT, count) {
    let p = start.clone();
    for (let i = 0; i < count; i++) {
      const center = SM.along(p, SM.orthoFwd(dirT.clone(), p), 0.8, new V3());
      if (!this.landOK(center, 0.9) || !this.placer.free(center, 0.85)) break;
      this.placer.add(center, 0.85);
      const t = SM.orthoFwd(dirT.clone(), center);
      const fwd = new V3().crossVectors(t, center).normalize();   // 使 local X 對齊 t
      this.I('fence').add(surfaceMatrix(center, fwd, 1, 0.06));
      for (const s of [-0.4, 0.4]) this.col.add(SM.along(center, t, s, new V3()), 0.3, 'fence');
      p = SM.along(p, SM.orthoFwd(dirT.clone(), p), 1.6, new V3());
    }
  }
  scatter(n, tries, gen, r, accept, place, checkPath = true, reserve = true) {
    let made = 0;
    for (let i = 0; i < tries && made < n; i++) {
      const d = gen();
      if (accept && !accept(d)) continue;
      if (!this.landOK(d, r) || !this.placer.free(d, r, checkPath)) continue;
      if (reserve) this.placer.add(d, r);
      place(d); made++;
    }
    return made;
  }
  /** 文字招牌：平面 + canvas 貼圖 */
  addTextPlane(text, d, fwd, lift, forwardOff, w, h, opts = {}) {
    const { tex } = makeLabelTexture(text, { size: 64, bg: opts.bg ?? '#fffaf0', fg: opts.fg ?? '#4a3b52' });
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex, transparent: true }));
    const mat = surfaceMatrix(d, fwd, 1, 0, new THREE.Matrix4(), lift);
    m.matrixAutoUpdate = false;
    m.matrix.copy(mat).multiply(new THREE.Matrix4().makeTranslation(opts.x || 0, 0, forwardOff));
    if (opts.flip) m.matrix.multiply(new THREE.Matrix4().makeRotationY(Math.PI));
    this.root.add(m);
    return m;
  }
  lampsAlongPaths(center, capAngle, spacing) {
    const cosCap = Math.cos(capAngle);
    for (const p of PATHS) {
      if (p.len < 0.05) continue;
      const steps = Math.floor(p.len * R / spacing);
      const perp = new V3().crossVectors(p.n, p.a);
      for (let i = 1; i < steps; i++) {
        const t = i / steps * p.len;
        const q = p.a.clone().multiplyScalar(Math.cos(t)).addScaledVector(perp, Math.sin(t)).normalize();
        if (q.dot(center) < cosCap) continue;
        const side = i % 2 ? 1 : -1;
        const ld = SM.along(q, p.n, side * (CFG.pathHalf + 0.75), new V3());
        if (this.landOK(ld, 0.4) && this.placer.free(ld, 0.4, false)) { this.placer.add(ld, 0.4); this.addLamp(ld); }
      }
    }
  }
  addSignpost(d) {
    const up = d;
    this.S('plaza').addM(new THREE.CylinderGeometry(0.08, 0.1, 2.6, 6), '#8a5a3b', surfaceMatrix(d, 0, 1, 0.1, new THREE.Matrix4(), 1.25));
    this.col.add(d, 0.25, 'sign');
    const dests = [['town', '小鎮'], ['forest', '森林'], ['lake', '湖畔公園'], ['power', '風車丘']];
    dests.forEach(([id, label], i) => {
      const t = this.toward(d, RG[id].c);
      const fwd = new V3().crossVectors(t, up).normalize();
      const y = 2.2 - i * 0.36;
      const m = surfaceMatrix(d, fwd, 1, 0, new THREE.Matrix4(), y).multiply(new THREE.Matrix4().makeTranslation(0.62, 0, 0));
      this.S('plaza').addM(new THREE.BoxGeometry(1.2, 0.28, 0.06), '#f6e3c0', m);
      const m2 = m.clone().multiply(new THREE.Matrix4().makeTranslation(0.6, 0, 0)).multiply(new THREE.Matrix4().makeRotationZ(Math.PI / 4));
      this.S('plaza').addM(new THREE.BoxGeometry(0.2, 0.2, 0.062), '#f6e3c0', m2);
      const { tex } = makeLabelTexture(label, { size: 48, bg: null, fg: '#6a4430' });
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
      for (const s of [1, -1]) {
        const pm = new THREE.Mesh(new THREE.PlaneGeometry(1.0, 0.24), mat);
        pm.matrixAutoUpdate = false;
        pm.matrix.copy(m).multiply(new THREE.Matrix4().makeTranslation(0, 0, 0.035 * s));
        if (s < 0) pm.matrix.multiply(new THREE.Matrix4().makeRotationY(Math.PI));
        this.root.add(pm);
      }
    });
  }

  }
  addPipe(a, b, K) {
    const ta = this.toward(a, b), tb = this.toward(b, a);
    const s = SM.along(a, ta, 3.5, new V3()), e = SM.along(b, tb, 1.8, new V3());

  /** 岩石平台：低多邊形岩柱 + 頂部草皮；碰撞為有頂面的圓柱，可以跳上去站 */
  addPlatform(d, r, topAbs, tag, opts = {}) {
    const localTop = topAbs - (R + terrainH(d)), seg = r > 3 ? 14 : 9, h = localTop + 0.7;
    const g = new THREE.CylinderGeometry(r * 0.97, r * 1.12, h, seg, 3);
    g.translate(0, h / 2 - 0.7, 0);
    const p = g.attributes.position, seed = wr(0, 50);
    for (let i = 0; i < p.count; i++) {
      const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
      const n = Noise.noise3(x * 1.1 + seed, y * 0.8, z * 1.1 - seed);

    const b = new GeoBuilder();

    if (opts.grass !== false) b.cyl(r * 0.86, r * 0.94, 0.12, seg, '#93cf73', 0, localTop - 0.02, 0);

  buildRocks() {
    const clear = (d, rad) => {
      if (pathDist(d) < CFG.pathHalf + rad + 1.5) return false;
      for (const r of REGIONS) if (SM.arc(d, r.c) < r.r * R + rad * 0.6) return false;
      return this.landOK(d, rad) && this.placer.free(d, rad, false);
    };
    // 巨型岩山：一層層的平台 + 繞著山的落腳石（每階約 0.8 公尺，跳得上去）
    const MOUNTAINS = [
      { name: '觀景岩', rad: 8.6, tiers: [[5.6, 2.4], [3.9, 4.8], [2.3, 7.2]],
        ledges: [[0, 7.0, 1.2, 0.85], [25, 7.25, 1.1, 1.65], [70, 4.75, 0.9, 3.2], [100, 4.65, 0.9, 4.0], [150, 3.1, 0.75, 5.6], [185, 3.0, 0.75, 6.4]] },
      { name: '小岩丘', rad: 6.7, tiers: [[4.2, 2.2], [2.4, 4.6]],
        ledges: [[0, 5.6, 1.1, 0.8], [30, 5.8, 1.0, 1.55], [90, 3.4, 0.8, 3.0], [125, 3.3, 0.8, 3.8]] },
    ];
    for (const M of MOUNTAINS) {
      let c = null;
      for (let i = 0; i < 6000 && !c; i++) {
        const d = this.randSphere();
        if (this.mountains.some(m => SM.arc(m.c, d) < 40)) continue;
        if (clear(d, M.rad)) c = d;
      }
      if (!c) continue;
      this.placer.add(c, M.rad);
      const base = R + terrainH(c), ledges = [];
      const tiers = M.tiers.map(([r, top], i) => this.addPlatform(c, r, base + top, i === M.tiers.length - 1 ? 'summit' : 'rock', { name: M.name }));
      for (const [b, dist, r, top] of M.ledges) ledges.push(this.addPlatform(SM.dirFrom(c, b, dist), r, base + top, 'rock'));
      // 山頂：旗子、標高牌、看風景的長椅

      const fd = SM.dirFrom(c, 200, 1.0), fl = top - (R + terrainH(fd));
      this.S('rocks').addM(new THREE.CylinderGeometry(0.05, 0.06, 2.2, 6), '#8a5a3b', surfaceMatrix(fd, 0, 1, 0, new THREE.Matrix4(), fl + 1.1));
      const pm = surfaceMatrix(fd, this.toward(fd, c), 1, 0, new THREE.Matrix4(), fl + 1.95).multiply(new THREE.Matrix4().makeTranslation(0.38, 0, 0));
      this.S('rocks').addM(new THREE.BoxGeometry(0.72, 0.44, 0.04), '#ff8b6b', pm);
      this.col.add(fd, 0.12, 'sign');
      this.addTextPlane(`${M.name} ▲ ${M.tiers[M.tiers.length - 1][1].toFixed(1)} m`, fd, this.toward(fd, c), fl + 0.9, 0.08, 1.15, 0.26, { bg: '#fffaf0' });
      const bd = SM.dirFrom(c, 20, 0.8), bf = this.toward(c, bd);
      this.addBench(bd, bf, false, top - (R + terrainH(bd)), true);
      for (let i = 0; i < 6; i++) {
        const gd = SM.dirFrom(c, wr(0, 360), wr(0.3, M.tiers[0][0] - 0.4));
        const gt = this.col.groundTop(gd);
        this.I('grass', { cast: false }).add(surfaceMatrix(gd, wr(0, 6.28), wr(0.9, 1.4), 0.03, new THREE.Matrix4(), gt - (R + terrainH(gd))), tint(0.85, 1.05));
      }
      const pd = SM.dirFrom(c, 200, M.rad + 1.6);
      this.pois.push({ d: pd, region: 'rock' });

      this.mountains.push({ c, name: M.name, top, tiers, ledges });
    }
    // 可以跳上去的大石塊（有些旁邊再放一顆更高的，當作踏腳石）
    for (let i = 0, made = 0; i < 4000 && made < 9; i++) {

      made++;

        const d2 = SM.along(d, SM.anyPerp(d, new V3()).applyAxisAngle(d, wr(0, 6.28)), r + 1.35, new V3());
        if (clear(d2, 1.5)) { this.placer.add(d2, 1.6); const r2 = wr(1.0, 1.3); const c2 = this.addPlatform(d2, r2, c1.top + 0.8, 'boulder'); this.boulders.push({ d: d2, r: r2, top: c2.top }); }
      }

  }
  /** 貓可以去的地方：屋脊、長椅、噴水池邊、大石塊 */
  buildPerches() {

    for (const r of this.roofs) {

      const half = r.w / 2 + 0.35, yAt = x => r.h - 0.02 + r.rh * (1 - Math.abs(x) / half), z = r.zf * r.dd;
      for (const side of [1, -1]) {

        if (this.col.blocked(ap, 0.35) || !this.landOK(ap, 0.3)) continue;

        const eave = new V3(ex, yAt(ex) + 0.03, z).applyMatrix4(m), ridge = new V3(0, r.h + r.rh + 0.04, z).applyMatrix4(m);
        this.perches.push({ kind: 'roof', approach: ap, points: [eave, ridge], up: r.d.clone().normalize(), face: r.fwd.clone(), taken: null });

    }
    for (const s of this.benches) {

    }

      this.perches.push({ kind: 'fountain', approach: ap, points: [SM.surface(rim, 0.43)], up: rim.clone(), face: this.toward(rim, PL).negate(), taken: null });
    }

      const t = SM.anyPerp(bd.d, new V3()).applyAxisAngle(bd.d, wr(0, 6.28));
      const ap = SM.along(bd.d, t, bd.r + 0.85, new V3());
      if (this.col.blocked(ap, 0.3)) continue;
      const pt = SM.along(bd.d, t, bd.r * 0.35, new V3());
      this.perches.push({ kind: 'rock', approach: ap, points: [pt.multiplyScalar(bd.top)], up: SM.along(bd.d, t, bd.r * 0.35, new V3()), face: t.clone(), taken: null });
    }
  }
  buildMeadow() {
    const core = d => { for (const r of REGIONS) if (d.dot(r.c) > Math.cos(r.r * 0.9)) return true; return false; };
    const stone = d => d.dot(PL) > K.STONE;
    this.scatter(80, 2000, () => this.randSphere(), 1.2, d => !core(d), d => this.addTree(d, wrng() < 0.35 ? 'treePine' : 'treeRound', wr(0.85, 1.4)));
    this.scatter(40, 1200, () => this.randSphere(), 0.7, d => !core(d) && !stone(d), d => { const s = wr(0.6, 1.6); this.I('rock').add(surfaceMatrix(d, wr(0, 6.28), new V3(s * 1.2, s * 0.8, s), 0.12), tint(0.9, 1.05)); this.col.add(d, 0.5 * s, 'rock', R + terrainH(d) + 0.5 * s - 0.12, 0.36 * s); });
    this.scatter(110, 2500, () => this.randSphere(), 0.6, d => !stone(d) && regionAt(d) !== RG.forest, d => this.I('bush').add(surfaceMatrix(d, wr(0, 6.28), wr(0.7, 1.3), 0.1), tint()));
  }
  buildDecor() {
    const stone = d => d.dot(PL) > K.STONE;
    const grassN = IS_MOBILE ? 650 : 950;
    this.scatter(grassN, grassN * 4, () => this.randSphere(), 0.18, d => !stone(d), d => this.I('grass', { cast: false }).add(surfaceMatrix(d, wr(0, 6.28), wr(0.8, 1.5), 0.03), tint(0.85, 1.08)), true, false);
    this.scatter(260, 2600, () => this.randSphere(), 0.2, d => !stone(d) && regionAt(d) !== RG.forest, d => {

    }, true, false);

    for (const p of PATHS) {

      for (const f of [0.33, 0.66]) {

  buildClouds() {
    const b = new GeoBuilder();
    b.ico(1.6, '#ffffff', 0, 0, 0, 1); b.ico(1.2, '#ffffff', 1.5, -0.2, 0.2, 1); b.ico(1.1, '#ffffff', -1.4, -0.3, -0.1, 1); b.ico(0.95, '#ffffff', 0.3, 0.7, -0.5, 1);
    const geo = b.build(), n = 16;

}

/* =========================================================================
 *  ColliderWorld — 依方向分桶的空間分格、靜態圓柱碰撞、角色軟碰撞
 * ========================================================================= */
const EMPTY = Object.freeze([]);
/** 以「單位方向向量」的 3D 格子分桶；物件插入其範圍涵蓋的所有格，查詢只看自己那格 */
class DirGrid {
  constructor(K) { this.K = K; this.S = 2 * K + 1; this.cells = new Array(this.S ** 3); this.touched = []; }
  idx(i) { return clamp(i, -this.K, this.K) + this.K; }
  key(x, y, z) { const K = this.K, S = this.S; return (this.idx(Math.floor(x * K)) * S + this.idx(Math.floor(y * K))) * S + this.idx(Math.floor(z * K)); }
  insert(d, ext, item) {
    const K = this.K, S = this.S;
    const x0 = this.idx(Math.floor((d.x - ext) * K)), x1 = this.idx(Math.floor((d.x + ext) * K));
    const y0 = this.idx(Math.floor((d.y - ext) * K)), y1 = this.idx(Math.floor((d.y + ext) * K));
    const z0 = this.idx(Math.floor((d.z - ext) * K)), z1 = this.idx(Math.floor((d.z + ext) * K));
    for (let ix = x0; ix <= x1; ix++) for (let iy = y0; iy <= y1; iy++) for (let iz = z0; iz <= z1; iz++) {
      const k = (ix * S + iy) * S + iz;
      let a = this.cells[k];
      if (!a) a = this.cells[k] = [];
      if (a.length === 0) this.touched.push(k);
      a.push(item);
    }
  }
  query(d) { return this.cells[this.key(d.x, d.y, d.z)] || EMPTY; }
  clear() { for (const k of this.touched) this.cells[k].length = 0; this.touched.length = 0; }
}

const _cd = new V3(), _ocP = new V3(), _ocU = new V3();
const STEP_UP = 0.4;   // 可以直接走上去的高度差
/** 靜態碰撞體：星球表面一點 + 半徑（垂直圓柱） */
/** 相機遮擋用：各類碰撞體的高度與遮擋半徑 */
const OCC_H = { house: 4.6, fountain: 2.3, stall: 3.4, windmill: 7.4, tank: 4.6, mailbox: 1.5, lamp: 3.0, bench: 0.9, fence: 0.8,
  board: 2.0, easel: 1.7, fire: 0.5, rock: 0.9, sign: 2.6, pipe: 2.7, solar: 1.3, mushroom: 2.8, lake: 0 };
class ColliderWorld {
  constructor() { this.grid = new DirGrid(12); this.list = []; }
  /** top > 0 代表有頂面的岩石平台（top 為到球心的絕對距離，rTop 為可站立的頂面半徑） */
  add(d, r, tag = '', top = 0, rTop = r) {
    const c = { d: d.clone().normalize(), r, tag, top, rTop };
    // 樹的碰撞只有樹幹，遮擋要用樹冠大小
    c.oh = top ? top - (R + terrainH(c.d)) + 0.2 : tag === 'tree' ? -1 : (OCC_H[tag] ?? 2.5);
    c.or = tag === 'tree' ? r * 3.4 : r + 0.1;
    this.list.push(c); this.grid.insert(c.d, (Math.max(r + 0.75, c.or + 0.2)) / R, c);
    return c;
  }
  /** 從 tgt 到 cam 的線段若被物件擋住，回傳可用的最大相機距離 */
  occlusion(tgt, cam, dist) {
    const N = 10;
    for (let k = 2; k <= N; k++) {
      _ocP.lerpVectors(tgt, cam, k / N);
      const l = _ocP.length(); _ocU.copy(_ocP).divideScalar(l);
      const above = l - (R + terrainH(_ocU));
      const cell = this.grid.query(_ocU);
      for (let i = 0; i < cell.length; i++) {
        const c = cell[i];
        if (above > c.oh) continue;
        if (_cd.subVectors(_ocU, c.d).length() * R < c.or) return Math.max(2.4, dist * (k - 1.6) / N);
      }
    }
    return dist;
  }
  /**
   * 在切平面上把單位方向 u 推出碰撞體，並移除速度中「往內」的分量（保留切向滑動）。
   * footR（腳底到球心距離）高於平台頂面 - STEP_UP 時，平台不擋路、而是可以站上去；回傳腳下最高的平台頂面。
   */
  resolve(u, rad, vel, footR = 0) {
    let support = 0; this.lastSupport = null;
    for (let it = 0; it < 3; it++) {
      const cell = this.grid.query(u);
      let any = false;
      for (let i = 0; i < cell.length; i++) {
        const c = cell[i];
        _cd.subVectors(u, c.d); _cd.addScaledVector(u, -_cd.dot(u));
        const len = _cd.length(), dist = len * R, min = c.r + rad;
        if (c.top && footR > 0 && footR >= c.top - STEP_UP) {
          if (dist < c.rTop + rad * 0.3 && c.top > support) { support = c.top; this.lastSupport = c; }
          continue;
        }
        if (dist < min) {
          if (len < 1e-7) SM.anyPerp(u, _cd); else _cd.multiplyScalar(1 / len);
          u.addScaledVector(_cd, (min - dist) / R).normalize();
          if (vel) { const vn = vel.dot(_cd); if (vn < 0) vel.addScaledVector(_cd, -vn); }
          any = true;
        }
      }
      if (!any) break;
    }
    return support;
  }
  /** 某方向上的地面高度（地形與平台頂面取最高），給相機用 */
  groundTop(u) {
    let g = R + terrainH(u);
    const cell = this.grid.query(u);
    for (let i = 0; i < cell.length; i++) { const c = cell[i]; if (c.top > g && _cd.subVectors(u, c.d).length() * R < c.r) g = c.top; }
    return g;
  }
  blocked(u, rad) {
    const cell = this.grid.query(u);
    for (let i = 0; i < cell.length; i++) { const c = cell[i]; if (_cd.subVectors(u, c.d).length() * R < c.r + rad) return true; }
    return false;
  }
}

const _dd = new V3();
/** 角色（玩家、NPC、其他郵差）每幀重建的分格，用來做互相輕推的軟碰撞 */
class DynamicWorld {
  constructor() { this.grid = new DirGrid(12); this.pool = []; this.n = 0; }
  begin() { this.grid.clear(); this.n = 0; }
  add(id, pos, r, fixed) {
    let e = this.pool[this.n];
    if (!e) e = this.pool[this.n] = { id: null, u: new V3(), r: 0, fixed: false };
    this.n++;
    e.id = id; e.u.copy(pos).normalize(); e.r = r; e.fixed = fixed;
    this.grid.insert(e.u, 1.0 / R, e);
  }
  resolveSoft(u, rad, selfId, dt, vel) {
    const cell = this.grid.query(u);
    for (let i = 0; i < cell.length; i++) {
      const e = cell[i];
      if (e.id === selfId) continue;
      _dd.subVectors(u, e.u); _dd.addScaledVector(u, -_dd.dot(u));
      const len = _dd.length(), dist = len * R, min = rad + e.r;
      if (dist >= min) continue;
      if (len < 1e-7) SM.anyPerp(u, _dd); else _dd.multiplyScalar(1 / len);
      const k = e.fixed ? Math.min(1, dt * 30) : Math.min(1, dt * 9) * 0.5;
      u.addScaledVector(_dd, (min - dist) * k / R).normalize();
      if (vel) { const vn = vel.dot(_dd); if (vn < 0) vel.addScaledVector(_dd, -vn * (e.fixed ? 0.9 : 0.35)); }
    }
  }
}

/* =========================================================================
 *  CharacterBody — 共用的球面移動（玩家與假玩家用同一套）
 *  狀態：pos、vel（切線速度）、vr（徑向速度）、forward（面向）、frameFwd（平行移動參考座標，給相機 yaw 用）
 * ========================================================================= */
const _cbT = new V3(), _cbP = new V3(), _cbU = new V3(), _cbQ = new QT();
class CharacterBody {
  constructor(dir, fwd) {
    this.up = dir.clone().normalize();
    this.pos = SM.surface(this.up);
    this.vel = new V3(); this.vr = 0;
    this.forward = SM.orthoFwd(fwd.clone(), this.up);
    this.frameFwd = this.forward.clone();
    this.quat = new QT();
    this.grounded = true; this.coyote = 0; this.jumped = false; this.landed = false; this.speed = 0;
    this.radius = CFG.charRadius; this.support = null;
    this.updateQuat();
  }
  place(dir, fwd) {
    this.up.copy(dir).normalize(); SM.surface(this.up, 0, this.pos);
    this.vel.set(0, 0, 0); this.vr = 0;
    this.forward.copy(fwd); SM.orthoFwd(this.forward, this.up); this.frameFwd.copy(this.forward);
    this.grounded = true; this.updateQuat();
  }
  step(dt, wishDir, wishSpeed, jump, colliders, dyn, selfId) {
    const up = this.up;
    // 平滑加減速（切平面）
    _cbT.copy(wishDir).multiplyScalar(wishSpeed);
    const rate = this.grounded ? (wishSpeed > 0.01 ? CFG.accel : CFG.decel) : CFG.airAccel;
    this.vel.lerp(_cbT, 1 - Math.exp(-rate * dt));
    SM.tangent(this.vel, up);
    // 跳躍（含 coyote time）
    this.jumped = false;
    if (jump && (this.grounded || this.coyote > 0)) { this.vr = CFG.jumpSpeed; this.grounded = false; this.coyote = 0; this.jumped = true; }
    this.vr -= CFG.gravity * dt;   // 重力沿 -up
    // 積分
    _cbP.copy(this.pos).addScaledVector(this.vel, dt).addScaledVector(up, this.vr * dt);
    let r = _cbP.length();
    _cbU.copy(_cbP).divideScalar(r);
    // 平行移動：把速度、forward、參考座標一起轉到新的切平面
    _cbQ.setFromUnitVectors(up, _cbU);
    this.vel.applyQuaternion(_cbQ); this.forward.applyQuaternion(_cbQ); this.frameFwd.applyQuaternion(_cbQ);
    // 碰撞（切平面上解）
    if (dyn) dyn.resolveSoft(_cbU, this.radius, selfId, dt, this.vel);   // 先軟推，再解靜態碰撞（靜態永遠優先，不會被推進牆裡）
    const support = colliders ? colliders.resolve(_cbU, this.radius, this.vel, r) : 0;
    this.support = support ? colliders.lastSupport : null;
    up.copy(_cbU);
    SM.tangent(this.vel, up); SM.orthoFwd(this.forward, up); SM.orthoFwd(this.frameFwd, up);
    // 著地：|pos| <= R + h(dir)
    const g = Math.max(R + terrainH(up), support);   // 地形或腳下的岩石平台
    const was = this.grounded;
    this.landed = false;
    if (r <= g) {
      if (!was && this.vr < -3) this.landed = true;
      r = g; if (this.vr < 0) this.vr = 0; this.grounded = true;
    } else if (was && this.vr <= 0 && r - g < 0.35) { r = g; this.vr = 0; this.grounded = true; }   // 下坡貼地
    else this.grounded = false;
    if (this.grounded) this.coyote = 0.12; else this.coyote -= dt;
    this.pos.copy(up).multiplyScalar(r);
    this.speed = this.vel.length();
  }
  /** 運動學移動到 p（例如坐下），同時平行移動 forward 與參考座標 */
  moveTo(p) {
    _cbU.copy(p).normalize(); _cbQ.setFromUnitVectors(this.up, _cbU);
    this.forward.applyQuaternion(_cbQ); this.frameFwd.applyQuaternion(_cbQ);
    this.up.copy(_cbU); SM.orthoFwd(this.forward, this.up); SM.orthoFwd(this.frameFwd, this.up);
    this.pos.copy(p);
  }
  /** 繞 up 軸 slerp 轉向 dir */
  faceToward(dir, rate, dt) {
    const a = SM.signedAngle(this.forward, dir, this.up);
    this.forward.applyAxisAngle(this.up, a * (1 - Math.exp(-rate * dt)));
    SM.orthoFwd(this.forward, this.up);
  }
  updateQuat() { SM.basisQuat(this.up, this.forward, this.quat); }
}

/* =========================================================================
 *  Navigation — 畫面內：世界空間標記 + 距離；畫面外：螢幕邊緣箭頭（大圓方向轉螢幕方向）
 * ========================================================================= */
const _nvA = new V3(), _nvB = new V3(), _nvT = new V3(), _nvP = new V3();
class Navigation {
  constructor() {
    this.marker = document.getElementById('nav-marker');
    this.mDist = this.marker.querySelector('.nm-dist');
    this.arrow = document.getElementById('nav-arrow');

    this.aIcon = this.arrow.querySelector('.na-arrow');
    this.lastDist = -1;
  }
  hide() { this.marker.classList.add('hidden'); this.arrow.classList.add('hidden'); }
  /** 視線是否被星球擋住 */
  occluded(cam, target) {
    const o = cam.position;
    _nvA.subVectors(target, o); const L = _nvA.length(); _nvA.divideScalar(L);
    const rr = R - 0.6, b = o.dot(_nvA), c = o.lengthSq() - rr * rr, disc = b * b - c;
    if (disc < 0) return false;
    const t0 = -b - Math.sqrt(disc);

  }
  update(cam, player, target, w, h) {
    if (!target) { this.hide(); return; }
    const dist = Math.round(SM.arc(player.body.pos, target));
    if (dist !== this.lastDist) { this.lastDist = dist; this.mDist.textContent = this.aDist.textContent = `${dist} m`; }
    _nvP.copy(target).project(cam);
    const inFront = _nvP.z < 1 && _nvP.z > -1;
    const onScreen = inFront && Math.abs(_nvP.x) < 0.94 && Math.abs(_nvP.y) < 0.9 && !this.occluded(cam, target);
    if (onScreen) {
      this.arrow.classList.add('hidden'); this.marker.classList.remove('hidden');
      const x = (_nvP.x * 0.5 + 0.5) * w, y = (-_nvP.y * 0.5 + 0.5) * h;
      this.marker.style.transform = `translate(${x}px, ${y - 6}px) translate(-50%, -100%)`;
      return;
    }
    // 畫面外：在玩家切平面上求朝目標的大圓方向，再投影到螢幕
    this.marker.classList.add('hidden'); this.arrow.classList.remove('hidden');
    SM.gcDir(player.body.pos, target, _nvT);
    player.headPos(_nvA);
    _nvB.copy(_nvA).addScaledVector(_nvT, 2.5);
    _nvA.project(cam); _nvB.project(cam);
    let dx = (_nvB.x - _nvA.x) * w, dy = -(_nvB.y - _nvA.y) * h;
    if (_nvA.z > 1 || _nvB.z > 1) { dx = -dx; dy = -dy; }
    const len = Math.hypot(dx, dy) || 1; dx /= len; dy /= len;
    // 箭頭限制在避開 HUD 的安全範圍內
    const top = Math.min(h * 0.35, 150), bot = h - Math.min(h * 0.2, 110), m = 58;
    const cx = w / 2, cy = (top + bot) / 2, hw = w / 2 - m, hh = (bot - top) / 2;
    const s = Math.min(Math.abs(dx) > 1e-4 ? hw / Math.abs(dx) : 1e9, Math.abs(dy) > 1e-4 ? hh / Math.abs(dy) : 1e9);
    const x = cx + dx * s, y = cy + dy * s;
    this.arrow.style.transform = `translate(${x}px, ${y}px)`;
    this.aIcon.style.transform = `rotate(${Math.atan2(dy, dx)}rad)`;
  }
}

/* =========================================================================
 *  PlayerSource / BotDriver — 其他郵差玩家的資料來源
 *
 *  所有「其他玩家」一律透過 PlayerSource 取得狀態：
 *    RemoteState = { id, name, position: Vector3, quaternion: Quaternion,
 *                    anim: { state: 'idle'|'walk'|'run'|'air'|'sit', speed },
 *                    emote: { id, seq },   // seq 遞增代表觸發一次新表情
 *                    outfit }
 *  事件：'join'(state, initial)、'leave'(id, name)
 *  本地玩家回報：sendLocalState(state)、sendLocalEmote(emoteId)
 *  畫面層（RemotePlayers）只依賴這個介面；日後換成 NetworkDriver（WebSocket）只需替換這一層。
 * ========================================================================= */
class PlayerSource {
  constructor() { this._ls = {}; }
  on(ev, fn) { (this._ls[ev] || (this._ls[ev] = [])).push(fn); return this; }
  emit(ev, ...args) { for (const fn of this._ls[ev] || []) fn(...args); }
  start() {}
  update(dt) {}
  /** @returns {Map<string, object>} id → RemoteState */
  getStates() { return new Map(); }
  get onlineCount() { return 1; }
  sendLocalState(state) {}
  sendLocalEmote(emoteId) {}
  dispose() {}
}

/**
 * NetworkDriver（示意，未啟用）：WebSocket 版的 PlayerSource。
 * 伺服器訊息 {t:'join'|'state'|'leave'|'emote', ...} 轉成 RemoteState；本地狀態以 10Hz 上傳。

    this.tone(1318.5, 0.8, { gain: 0.07, at: 0.42 });
  }

  }

  join() { this.tone(988, 0.2, { gain: 0.04 }); this.tone(1318.5, 0.3, { gain: 0.04, at: 0.1 }); }

    g.gain.setValueAtTime(0.09 * vol, t0 + dur * 0.6); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);

  }
  /** 呼嚕：低通雜訊以約 24Hz 調幅 */
  purr(vol = 1) {
    if (!this.ok || vol <= 0.02) return;

    const src = c.createBufferSource(); src.buffer = this.noiseBuf;
    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 220;

  }
  startAmbient() {
    const c = this.ctx;

    const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 420; f.Q.value = 0.5;
    const g = c.createGain(); g.gain.value = 0.05;

      this.chimeT = rnd(2.5, 6);

      }
    }
  }
}

/* =========================================================================
 *  InputManager — 鍵盤、滑鼠拖曳／滾輪、觸控搖桿與右半螢幕拖曳
 * ========================================================================= */
class InputManager {
  constructor(canvas) {
    this.keys = new Set(); this.handlers = {};
    this.look = { dx: 0, dy: 0 }; this.zoomD = 0;
    this.joy = { active: false, id: null, x: 0, y: 0, cx: 0, cy: 0 };
    this.drag = { id: null, x: 0, y: 0 };
    window.addEventListener('keydown', e => this.onKey(e, true));
    window.addEventListener('keyup', e => this.onKey(e, false));
    window.addEventListener('blur', () => this.keys.clear());
    canvas.addEventListener('pointerdown', e => this.onDown(e));
    window.addEventListener('pointermove', e => this.onMove(e));
    window.addEventListener('pointerup', e => this.onUp(e));
    window.addEventListener('pointercancel', e => this.onUp(e));
    canvas.addEventListener('wheel', e => { e.preventDefault(); this.zoomD += e.deltaY * (e.deltaMode === 1 ? 30 : 1); }, { passive: false });
    canvas.addEventListener('contextmenu', e => e.preventDefault());
    const zone = document.getElementById('joy-zone');
    this.base = document.getElementById('joy-base'); this.knob = document.getElementById('joy-knob');
    zone.addEventListener('pointerdown', e => {
      e.preventDefault(); this.fire('touch');
      if (this.joy.id !== null) return;
      this.joy.id = e.pointerId; this.joy.active = true; this.joy.cx = e.clientX; this.joy.cy = e.clientY;
      const zr = zone.getBoundingClientRect();
      this.base.style.left = (e.clientX - zr.left - 62) + 'px'; this.base.style.top = (e.clientY - zr.top - 62) + 'px'; this.base.style.bottom = 'auto';
      try { zone.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
      this.updJoy(e);
    });
    zone.addEventListener('pointermove', e => { if (e.pointerId === this.joy.id) this.updJoy(e); });
    const end = e => {
      if (e.pointerId !== this.joy.id) return;
      this.joy.id = null; this.joy.active = false; this.joy.x = this.joy.y = 0;
      this.knob.style.transform = ''; this.base.style.left = ''; this.base.style.top = ''; this.base.style.bottom = '';
    };
    zone.addEventListener('pointerup', end); zone.addEventListener('pointercancel', end);
  }
  on(name, fn) { this.handlers[name] = fn; }
  fire(name, arg) { const h = this.handlers[name]; if (h) h(arg); }
  onKey(e, down) {
    const code = e.code;
    if (['Space', 'Tab', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(code)) e.preventDefault();
    if (!down) { this.keys.delete(code); return; }
    this.keys.add(code);
    if (e.repeat) return;
    switch (code) {
      case 'KeyE': case 'Enter': case 'NumpadEnter': this.fire('interact'); break;
      case 'Space': this.fire('jump'); break;
      case 'Tab': this.fire('quests'); break;
      case 'KeyC': this.fire('outfit'); break;
      case 'Escape': this.fire('escape'); break;
      case 'KeyM': this.fire('mute'); break;
      default: {
        const m = /^(Digit|Numpad)([1-6])$/.exec(code);
        if (m) this.fire('emote', +m[2] - 1);
      }
    }
  }
  getMove() {
    let x = 0, y = 0; const k = this.keys;
    if (k.has('KeyW') || k.has('ArrowUp')) y += 1;
    if (k.has('KeyS') || k.has('ArrowDown')) y -= 1;
    if (k.has('KeyD') || k.has('ArrowRight')) x += 1;
    if (k.has('KeyA') || k.has('ArrowLeft')) x -= 1;
    let run = k.has('ShiftLeft') || k.has('ShiftRight');
    if (this.joy.active) { x = this.joy.x; y = this.joy.y; run = Math.hypot(x, y) > 0.86; }
    const m = Math.hypot(x, y); if (m > 1) { x /= m; y /= m; }
    return { x, y, run };
  }
  consumeLook() { const r = [this.look.dx, this.look.dy]; this.look.dx = this.look.dy = 0; return r; }
  consumeZoom() { const z = this.zoomD; this.zoomD = 0; return z; }
  onDown(e) {
    if (e.pointerType === 'touch') this.fire('touch');
    if (this.drag.id !== null) return;
    this.drag.id = e.pointerId; this.drag.x = e.clientX; this.drag.y = e.clientY;
    try { e.target.setPointerCapture(e.pointerId); } catch (err) { /* 忽略 */ }
  }
  onMove(e) {
    if (e.pointerId !== this.drag.id) return;
    const s = e.pointerType === 'touch' ? 1.5 : 1;
    this.look.dx += (e.clientX - this.drag.x) * s; this.look.dy += (e.clientY - this.drag.y) * s;
    this.drag.x = e.clientX; this.drag.y = e.clientY;
  }
  onUp(e) { if (e.pointerId === this.drag.id) this.drag.id = null; }
  updJoy(e) {
    let dx = e.clientX - this.joy.cx, dy = e.clientY - this.joy.cy;
    const max = 56, m = Math.hypot(dx, dy);
    if (m > max) { dx *= max / m; dy *= max / m; }
    this.knob.style.transform = `translate(${dx}px, ${dy}px)`;
    let x = dx / max, y = -dy / max;
    if (Math.hypot(x, y) < 0.12) { x = 0; y = 0; }
    this.joy.x = x; this.joy.y = y;
  }
}

    const A = this.world.anim;
    for (const b of A.blades) b.rotateZ(dt * b.userData.speed * 1.7);
    for (const j of A.jets) j.scale.set(1, 0.85 + Math.sin(t * 6) * 0.15 + Math.sin(t * 13) * 0.05, 1);
    for (const f of A.fires) f.scale.set(1 + Math.sin(t * 17) * 0.08, 0.85 + Math.sin(t * 11) * 0.2 + Math.sin(t * 23) * 0.08, 1 + Math.cos(t * 15) * 0.08);
    for (const r of A.ripples) { const p = (t * 0.45 + r.userData.phase) % 1; r.scale.setScalar(0.5 + p * 3); r.material.opacity = 0.7 * (1 - p); }
    if (A.clouds) A.clouds.rotation.y += dt * 0.012;
  }
  frame() {
    const dt = Math.min(this.clock.getDelta(), 0.05);   // dt 上限，切換分頁回來不暴衝
    if (!this.paused) this.update(dt);
    this.renderer.render(this.scene, this.camera);
  }
  update(dt) {
    this.time += dt;
    const t = this.time, ui = this.ui, p = this.player;
    const canMove = this.mode === 'play' && !ui.blocking();
    const [dx, dy] = this.input.consumeLook(), zd = this.input.consumeZoom();
    this.cam.rotate(dx, dy); this.cam.zoom(zd);
    this.emoteCD -= dt;
    // 角色分格（軟碰撞）
    this.dyn.begin();
    if (!p.seat) this.dyn.add('player', p.body.pos, CFG.charRadius, false);
    for (const c of this.cats.list) if (!c.kin) this.dyn.add(c.id, c.pos, 0.24, false);
    for (const n of this.npcs.list) this.dyn.add(n.id, n.pos, 0.45, true);
    for (const [id, s] of this.source.getStates()) if (s.anim.state !== 'sit') this.dyn.add(id, s.position, CFG.charRadius, false);
    if (this.cam.mode === 'showcase') p.body.forward.applyAxisAngle(p.body.up, dt * 0.6);   // 換裝預覽：角色緩慢旋轉
    p.update(dt, this.input, this.cam, canMove);
    // 站著不動 5 秒後，相機慢慢轉到角色背後
    const mv = this.input.getMove();
    const still = this.mode === 'play' && !ui.panel && this.cam.mode === 'follow' && Math.hypot(mv.x, mv.y) < 0.1 && p.body.speed < 0.3 && p.body.grounded;
    if (still && dx === 0 && dy === 0 && zd === 0) this.idleT += dt; else this.idleT = 0;
    if (this.idleT > 5) this.cam.recenter(p.body, dt);
    // 爬上岩山山頂：可以把相機拉得更遠看風景
    const sup = p.seat ? null : p.body.support;
    if (sup && sup.tag === 'summit' && !this.onSummit) {
      this.onSummit = true; this.cam.maxDist = 24; this.cam.distT = Math.max(this.cam.distT, 13);
      if (this.mode === 'play') { this.ui.toast(`登上${sup.name}山頂！好遼闊的風景～`, 'good'); this.audio.complete(); }
    } else if (this.onSummit && !p.seat && p.body.grounded && !(sup && sup.tag === 'summit')) {
      this.onSummit = false; this.cam.maxDist = 15; if (this.cam.distT > 15) this.cam.distT = 15;
    }
    // 本地狀態 → PlayerSource
    const ls = this.localState;
    ls.position.copy(p.body.pos); ls.quaternion.copy(p.body.quat);
    ls.anim.state = p.seat ? 'sit' : !p.body.grounded ? 'air' : p.body.speed > 5.2 ? 'run' : p.body.speed > 0.3 ? 'walk' : 'idle'; ls.anim.speed = p.body.speed;
    this.source.sendLocalState(ls);
    this.source.update(dt);
    this.cam.update(dt, p.body);
    const cullDir = _gA.copy(this.camera.position).normalize();
    this.remotes.update(dt, this.camera.position, cullDir);
    this.npcs.update(dt, p, this.camera.position, t, cullDir);
    this.cats.update(dt, p, this.camera.position, cullDir);
    this.finds.update(dt, t, this.quests);
    if (this.mode === 'play') this.checkFinds(dt);
    // 互動提示
    let prompt = null;
    if (this.mode === 'play' && !ui.dlg) {
      this.nearNPC = this.npcs.nearest(p.body.pos, CFG.interactDist);
      this.nearCat = this.nearNPC ? null : this.cats.nearestPettable(p);
      this.nearSeat = this.nearCat || p.seat ? null : this.findSeat();
      // NPC 與空座位都在附近時（例如詩詩旁邊的位子），比較近的那個優先
      if (this.nearNPC && this.nearSeat) {
        if (seatPos(this.nearSeat, _gB).distanceTo(p.body.pos) + 0.1 < SM.arc(this.nearNPC.pos, p.body.pos)) this.nearNPC = null;
        else this.nearSeat = null;
      }
      if (this.nearNPC) prompt = { key: 'npc:' + this.nearNPC.id, text: `和${this.nearNPC.name}說話`, btn: '說話' };
      else if (this.nearCat) prompt = { key: 'cat:' + this.nearCat.id, text: `摸摸${this.nearCat.name}`, btn: '摸摸' };
      else if (p.seat && p.sitPhase === 'sit') prompt = { key: 'stand', text: '起身（或直接移動）', btn: '起身' };
      else if (this.nearSeat) prompt = { key: 'sit', text: '坐下', btn: '坐下' };
    } else { this.nearNPC = this.nearCat = this.nearSeat = null; }
    ui.setPrompt(ui.blocking() ? null : prompt);
    this.markT -= dt;
    if (this.markT <= 0) { this.markT = 0.5; this.refreshMarkers(); }
    this.emotes.update(dt);
    this.animateWorld(dt, t);
    const reg = regionAt(p.body.up);
    this.audio.update(dt, reg ? reg.id : null);
    this.updateViewOffset(dt);
    this.updateSun();
    // 遮擋淡出：以玩家在螢幕上的位置為中心
    const pr = this.renderer.getPixelRatio();
    _gB.copy(p.body.up).add(p.body.pos).project(this.camera);
    FADE.uCenter.value.set((_gB.x * 0.5 + 0.5) * innerWidth * pr, (_gB.y * 0.5 + 0.5) * innerHeight * pr, innerHeight * pr);
    FADE.uFade.value = this.camera.position.distanceTo(p.body.pos) - 0.8;
    // 導引
    const q = this.quests;
    const tgt = this.mode === 'play' && q.tracked && !ui.panel && !ui.dlg ? q.targetOf(q.tracked, this.finds.items) : null;
    if (tgt) { if (tgt.npc) tgt.pos.addScaledVector(tgt.npc.up, 2.2); else tgt.pos.multiplyScalar(1 + 0.6 / tgt.pos.length()); this.nav.update(this.camera, p, tgt.pos, innerWidth, innerHeight); ui.setDist(Math.round(SM.arc(p.body.pos, tgt.pos))); }
    else { this.nav.hide(); ui.setDist(null); }
    ui.update(dt);
    this.saveT -= dt;
    if (this.saveT <= 0) { this.saveT = 10; if (this.mode === 'play') this.saveGame(); }
  }
}

const game = new Game();
window.__game = game;   // 方便除錯
window.__dbg = { THREE, SM, terrainH, pathDist, regionAt, CFG, QUESTS, RG, PATHS, FADE };
const start = (data) => game.init(data || {}).catch(err => {
  const e = document.getElementById('ld-err');
  if (e) e.textContent = '載入失敗：' + (err && err.message ? err.message : err);
  console.error(err);
});
// 在 claude.ai 頁面中重新發佈時，保留進行中的遊戲（一般瀏覽器中 window.claude 不存在，直接啟動）
const hot = window.claude && window.claude.hot;
if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => {
  try { if (game.mode === 'play' || game.mode === 'ending') game.saveGame(); } catch (e) { /* 忽略 */ }
  return { resume: game.mode === 'play' || game.mode === 'ending' };
});
if (hot && typeof hot.ready === 'function') hot.ready(start); else start((hot && hot.data) || {});
</script>
</body>
